note: >-
  SignalWire sells usage-based, pay-as-you-go pricing with no named subscription tiers — there is no
  Free/Pro/Enterprise ladder to record. The pricing page is one tabbed reference (AI Agents, Voice
  API, Messaging API, MFA API, Video API, Fax API) of per-minute and per-message rates, plus a
  "Talk to an Expert" path for volume pricing, committed-use discounts and enterprise agreements.
  Accounts start in Trial mode until at least $5 USD of credit is added (source:
  https://signalwire.com/docs/platform/rate-limits). Rates below are transcribed verbatim from the
  pricing page as published on 2026-08-27; rate cards change, and per-destination voice and
  messaging rates vary by country and number type beyond what is captured here.
