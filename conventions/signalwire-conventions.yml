  see: asyncapi/signalwire-webhooks.yml
  docs: https://signalwire.com/docs/platform/webhooks
reversibility:
  grade: verified
  write_surface: true
  summary: >-
    SignalWire publishes reversal paths for the two most consequential real-money actions — an
    outbound call and an outbound fax — and states the state window each one works inside. It does
    NOT publish an undo or restore for resource deletion: every DELETE in both contracts is
    terminal, and message redaction is explicitly irreversible. An agent should treat resource
    deletion and message redaction as one-way doors and cancellation as time-boxed to a pre-terminal
    call/fax state.
  reversals:
  - action: Place an outbound call
    reversal: Update the call with Status=canceled (before it is answered) or Status=completed (to
      hang up an in-progress call)
    operationId: update_a_call
    contract: openapi/signalwire-compatibility-openapi.yml
    window: >-
      canceled applies only while the call has not yet connected — the error-code reference lists
      "An attempt was made to cancel an in-progress call" as error 10000. Once in progress the only
      reversal is completed (hang up); once the call is completed no update is accepted.
    window_stated: true
    docs: https://signalwire.com/docs/compatibility-api/rest/error-codes
  - action: Send a fax
    reversal: Update the fax with Status=canceled
    operationId: update_fax
    contract: openapi/signalwire-compatibility-openapi.yml
    window: >-
      "The fax must be in 'queued' status to be canceled." Stated verbatim in the spec's own
      parameter description. An attempt to cancel an in-progress or finished fax returns error 10000.
    window_stated: true
    docs: https://signalwire.com/docs/compatibility-api/rest/error-codes
  - action: Send a message
    reversal: none (redaction is not a reversal)
    operationId: update_message
    contract: openapi/signalwire-rest-openapi.yml
    window: >-
      A delivered message cannot be recalled. The body can be REDACTED (PATCH with body="") only
      after the message reaches a terminal state (delivered, undelivered, failed); messages still
      queued or initiated cannot be redacted. "Once redacted, the original body is overwritten and
      cannot be recovered."
    window_stated: true
    irreversible: true
  irreversible_operations:
    count: 51
    classes:
    - 37 DELETE/redact operations on the SignalWire REST API (Fabric resources, Datasphere documents
      and chunks, subscribers, SIP credentials and gateways, rooms, recordings, streams, phone
      numbers, project tokens, subprojects, verified caller IDs, number groups)
    - 14 DELETE operations on the Compatibility API (calls, messages, recordings, transcriptions,
      faxes and media, applications, queues, incoming phone numbers, cXML scripts, tokens)
    restore_path: none published
    retention_window: none published
    note: >-
      No restore, undelete, trash or retention window is documented for any deletion. Releasing a
      phone number (release_phone_number) is not reversible either — the number returns to the pool.
dry_run_mode:
  supported: false
  note: No dry-run, preview or validate-only parameter is declared in either contract. The closest
    published equivalent is the swaig-test CLI, which exercises an agent's tools locally without
    placing a call — see sandbox/signalwire-sandbox.yml.
