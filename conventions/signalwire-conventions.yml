  style: HTTP callback to a customer URL, configured via a Resource attached to a phone number
  response_contract: Handler replies 200 OK with SWML (or cXML on the Compatibility API)
  signature_validation: validate_webhook_signature / validate_request helpers in the Server SDKs
  declared_in_spec: true
