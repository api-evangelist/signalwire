      self: URL of the current page
      first: URL of the first page
      next: URL of the next page
      prev: URL of the previous page
    data: array of resources
  guidance: >-
    The docs state it is "highly recommended" to navigate using the returned link values rather than
    constructing page URLs, so that results are not affected by new resources being created or by a
