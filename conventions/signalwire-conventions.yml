base_url:
  pattern: https://{your_space}.signalwire.com
  structure: https://{your_space}.signalwire.com/api/{family}/{resource}
  families:
  - messaging
  - calling
  - fabric
  - video
  - datasphere
  - project
  - relay/rest
  - laml/2010-04-01 (Compatibility API)
  per_tenant: true
  per_tenant_note: >-
    Every Space has its own subdomain and every request goes through it. There is no single shared
    API host — this is why servers[] in both contracts is templated on {space_name}. An agent must be
    told the Space subdomain before it can call anything.
  https_only: true
  https_note: Plain HTTP requests are refused; there is no automatic upgrade.
  docs: https://signalwire.com/docs/apis/base-url
authentication:
  styles:
  - name: HTTP Basic
    credential: Project ID as username, API Token as password, base64-encoded
    scope: The standard method for SignalWire REST APIs
    expiry: API credentials do not expire
  - name: HTTP Bearer
    credential: Subscriber Access Token (SAT) or Guest Token
    scope: Client-side calls where API credentials cannot be exposed
    expiry: Short-lived; a 401 means fetch a fresh token
    refresh: Refresh Subscriber Token endpoint
  token_scopes:
    supported: true
    granularity: Tokens can be scoped in the Dashboard to limit API access; a 403 means the token
      lacks the required scope.
    oauth2: false
    note: Scopes are selected in the Dashboard, not negotiated over OAuth. There is no OAuth 2.0
      securityScheme in either contract, so no scopes/ artifact is emitted.
  docs: https://signalwire.com/docs/apis/authorization
  see: authentication/signalwire-authentication.yml
idempotency:
  supported: false
  header: null
  evidence: >-
    Neither OpenAPI contract declares an Idempotency-Key (or any) request header parameter on any of
    its 332 operations, and no idempotency page exists in the documentation. Retrying a POST that
    places a call or sends a message can duplicate it. This is a real gap for agent use, not a
    documentation gap on our side — no Idempotency pointer is emitted.
  checked: '2026-08-27'
pagination:
  style: link-based (HAL-ish links object)
  response_fields:
