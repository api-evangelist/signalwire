  note: >-
    SignalWire publishes NO dated platform/API changelog page. The docs site (Fern) has no changelog
    product and the marketing site 404s on every changelog path probed on 2026-08-27. What IS dated
    and public is release history per SDK repository and per package registry, so that is what is
    recorded below. There is also no release-notes surface for the REST contracts themselves — both
    OpenAPI documents declare info.version 1.0.0 and carry no dated history, so an integrator cannot
    tell from the contract what changed between two fetches of it.
scheme: semver (per SDK); the REST contracts are unversioned apart from the Compatibility API's
