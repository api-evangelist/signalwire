aid: signalwire
name: SignalWire
description: SignalWire is a Programmable Unified Communications (PUC) platform for voice, messaging,
  video, fax, SIP and AI voice agents, built by the team behind FreeSWITCH. It publishes two first-party
  OpenAPI 3.1 contracts from its public documentation repository — a 253-operation SignalWire REST API
  covering calling, messaging, video rooms, phone number management, Campaign Registry/10DLC, WhatsApp,
  Datasphere, SIP resources, subscribers, AI agents and logs, and a 79-operation Twilio-compatible
  Compatibility (LaML) API at /api/laml/2010-04-01 — plus an OpenRPC 1.3.2 JSON-RPC contract for live
  call control, a JSON Schema for SWML (SignalWire Markup Language), and 19 OpenAPI 3.1 webhook
  definitions covering AI/SWAIG, calling and messaging callbacks. Every request is served from a
  per-customer Space subdomain, {space_name}.signalwire.com, over HTTPS only.
url: https://raw.githubusercontent.com/api-evangelist/signalwire/refs/heads/main/apis.yml
