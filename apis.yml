  - type: Overlay
    url: overlays/signalwire-compatibility-overlay.yaml
- aid: signalwire:signalwire-calling-rpc
  name: SignalWire Calling API (JSON-RPC)
  description: An OpenRPC 1.3.2 contract for real-time control of live calls over RELAY — 8 methods
    (calling.dial, calling.update, calling.end, calling.ai_hold, calling.ai_unhold, calling.ai_message,
    calling.live_transcribe, calling.live_translate) addressed by call UUID.
  humanURL: https://signalwire.com/docs/apis
  baseURL: https://{space_name}.signalwire.com/api/calling/rpc
  tags:
  - Voice
  - RELAY
  - JSON-RPC
  properties:
