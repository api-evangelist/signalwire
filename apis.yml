  - type: Authentication
    url: https://signalwire.com/docs/apis/authorization
  - type: ErrorCatalog
    url: https://signalwire.com/docs/apis/error-codes
  - type: Webhooks
    url: openapi/signalwire-rest-openapi.yml
  - type: Overlay
    url: overlays/signalwire-rest-overlay.yaml
- aid: signalwire:signalwire-compatibility-api
  name: SignalWire Compatibility API
  description: The Twilio-compatible (LaML) REST API — 79 operations across 45 paths for accounts,
    applications, available and incoming phone numbers, calls, conferences and participants,
    recordings and transcriptions, streams, faxes and fax media, messages and message media, queues
    and queue members, cXML scripts, and API tokens. Accepts Twilio-style requests so most migrations
    change the endpoint and credentials rather than rewriting the application. Declares 5 OpenAPI 3.1
    webhooks for call, recording, SMS, transcription and voice status callbacks.
  humanURL: https://signalwire.com/docs/compatibility-api
  baseURL: https://{space_name}.signalwire.com/api/laml/2010-04-01
  tags:
  - Voice
  - Messaging
  - Fax
  - Twilio Compatible
  properties:
  - type: OpenAPI
    url: openapi/signalwire-compatibility-openapi.yml
  - type: Documentation
