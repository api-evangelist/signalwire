apis:
- aid: signalwire:signalwire-rest-api
  name: SignalWire REST API
  description: The first-party SignalWire REST API — 253 operations across 151 paths covering calling,
    queues, recordings, video rooms and sessions, messaging, Campaign Registry (10DLC) brands and
    campaigns, WhatsApp, phone numbers and E911 addresses, number groups, verified caller ID, SIP
    credentials/gateways/profiles/addresses, subscribers and subscriber tokens, Fabric resources and
    addresses, SWML and cXML scripts and webhooks, call flows, AI agents (custom and Dialogflow),
    Datasphere documents and chunks, projects and project tokens, PubSub and chat tokens, and logs.
    Declares 14 OpenAPI 3.1 webhooks for AI/SWAIG, calling and messaging callbacks.
  humanURL: https://signalwire.com/docs/apis
  baseURL: https://{space_name}.signalwire.com
  tags:
  - Voice
  - Messaging
  - Video
  - SIP
  - AI Agents
  - Phone Numbers
  properties:
