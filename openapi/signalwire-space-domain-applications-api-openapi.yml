  parameters:
    ListDomainApplicationsQuery.page_token:
      name: page_token
      in: query
      required: false
      description: Token for cursor-based pagination. Required when page_number > 0.
      schema:
        type: string
      explode: false
    DomainApplicationPathID:
      name: id
      in: path
      required: true
      description: Unique ID of the domain application.
      schema:
        $ref: '#/components/schemas/uuid'
    ListDomainApplicationsQuery.page_size:
      name: page_size
      in: query
      required: false
      description: The number of items per page (1-1000).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 50
      explode: false
    ListDomainApplicationsQuery.filter_domain:
      name: filter_domain
      in: query
      required: false
      description: String representing the domain portion of the domain application. Will return all domain applications containing this value as a substring.
      schema:
        type: string
      explode: false
    ListDomainApplicationsQuery.filter_name:
      name: filter_name
      in: query
      required: false
      description: String representing the name portion of the domain application. Will return all domain applications containing this value as a substring.
      schema:
        type: string
      explode: false
    ListDomainApplicationsQuery.page_number:
      name: page_number
      in: query
      required: false
      description: The page number to retrieve (0-indexed).
      schema:
        type: integer
        format: int32
        default: 0
      explode: false
  securitySchemes:
    SignalWireBasicAuth:
      type: http
      scheme: Basic
      description: 'SignalWire Basic Authentication using Project ID and API Token.


        The client sends HTTP requests with the Authorization header containing

        the word Basic followed by a space and a base64-encoded string of project_id:token.

        The project ID will be used as the username and the API token as the password.


        Example:

        ```

        Authorization: Basic base64(project_id:token)

        ```'
      x-fern-basic:
        username:
          name: project_id
          env: SIGNALWIRE_PROJECT_ID
        password:
          name: api_token
          env: SIGNALWIRE_API_TOKEN
    SignalWireBearerAuth:
      type: http
      scheme: Bearer
      description: 'SignalWire Bearer Token Authentication for subscriber endpoints.

        The client sends HTTP requests with the Authorization header containing

        the word Bearer followed by a space and the subscriber token.


        Example:

        ```

        Authorization: Bearer <subscriber_token>

        ```'
