    SWMLWebhook:
      type: object
      required:
      - id
      - name
      - used_for
      - primary_request_url
      - primary_request_method
      - fallback_request_url
      - fallback_request_method
      - status_callback_url
      - status_callback_method
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Unique ID of the SWML Webhook.
