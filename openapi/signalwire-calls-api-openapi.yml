    Calling.CallCollectRequest:
      type: object
      required:
      - id
      - command
      - params
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: The unique identifying ID of a existing call.
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        command:
          type: string
          enum:
          - calling.collect
          description: The `calling.collect` command collects user input (digits or speech) during a call.
          examples:
          - calling.collect
        params:
          type: object
          properties:
            control_id:
              type: string
              description: Unique identifier for this collect operation, used to control it later. Must be unique per active collect on this call.
              examples:
              - collect-control-1
            initial_timeout:
              type: number
              format: double
              description: Maximum time in seconds to wait for initial input. Must be positive. Defaults to the server-configured no-input timeout when omitted.
              examples:
              - 5
            digits:
              allOf:
              - $ref: '#/components/schemas/Calling.CollectDigitsParams'
              description: Configuration for collecting DTMF digit input. Provide `digits`, `speech`, or both.
              examples:
              - max: 4
                terminators: '#'
            speech:
              allOf:
              - $ref: '#/components/schemas/Calling.CollectSpeechParams'
              description: Configuration for collecting speech input. Provide `digits`, `speech`, or both.
              examples:
              - end_silence_timeout: 3
                language: en-US
            continuous:
              type: boolean
              description: If `true`, the collect restarts after each result until `calling.collect.stop` is called. Continuous events include a `state` field indicating collect state.
              examples:
              - false
              default: false
            partial_results:
              type: boolean
              description: If `true`, partial results are delivered as they are recognized, and events include a `final` field (`false` for partial, `true` for final).
              examples:
              - false
              default: false
            send_start_of_input:
              type: boolean
              description: If `true`, a `start_of_input` webhook event is fired when input is first detected.
              examples:
              - false
              default: false
            start_input_timers:
              type: boolean
              description: If `false`, the initial-timeout clock does not start until `calling.collect.start_input_timers` is called for this `control_id`.
              examples:
              - false
              default: false
            status_url:
              type: string
              format: uri
              description: HTTP or HTTPS URL that receives collect result webhooks.
              examples:
              - https://example.com/collect_callback
          required:
          - control_id
          unevaluatedProperties:
            not: {}
          description: An object of parameters that will be utilized by the active command.
      unevaluatedProperties:
        not: {}
      description: 'Collect user input (DTMF digits, speech, or both) on an active call.


        At least one of `digits` or `speech` must be provided; requests missing

        both return 400. Results are delivered asynchronously via the `status_url`

        webhook. Digit events have the shape `{control_id, call_id, node_id, result: {type:"digit", params: {digits, terminator}}}`

        and speech events `{..., result: {type:"speech", params: {text, confidence}}}`.


        When `start_input_timers` is `false`, the `initial_timeout` clock does not

        start until you send `calling.collect.start_input_timers` for the same

        `control_id`.'
      title: calling.collect
