    Calling.CallCreateParamsURL:
      type: object
      required:
      - from
      - url
      properties:
        from:
          type: string
          description: The address that initiates the call. For PSTN destinations, must be an E.164 number; for SIP/Verto destinations may also be a SIP URI (`sip:user@host`) or a short caller-id token.
          examples:
          - sip:from-sip@example-112233445566.sip.signalwire.com
        to:
          type: string
          description: Destination address. Accepts E.164 (`+xxxxxxxxxxx`), SIP URI (`sip:` / `sips:`), Verto URI (`verto:`), client address (`client:`), or a fabric address. Required unless `to_script` is provided.
          examples:
          - sip:from-sip@example-112233445567.sip.signalwire.com
        username:
          type: string
          description: SIP authentication username, forwarded to the destination when `to` is a SIP URI. Ignored for PSTN and WebRTC/Verto destinations. Write-only — never returned in the call response.
          examples:
          - alice
        password:
          type: string
          description: SIP authentication password, forwarded to the destination when `to` is a SIP URI. Ignored for PSTN and WebRTC/Verto destinations. Write-only — never returned in the call response.
          examples:
          - s3cr3t
        to_script:
          anyOf:
          - type: string
          - type: object
            unevaluatedProperties: {}
          description: Inline [Calling SWML document](/docs/swml/reference/calling) (JSON or YAML string), or an `http(s)://` URL that returns one, executed at the destination end. Useful for directing the call to a RelayBin / external SWML handler. When present, `to` may be omitted.
          examples:
          - version: 1.0.0
            sections:
              main:
              - play:
                  url: https://cdn.signalwire.com/swml/audio.mp3
          - https://example.com/destination.swml.json
        caller_id:
          type: string
          description: Caller ID displayed to the destination. E.164 for PSTN; short caller-id token or SIP URI for SIP/Verto.
          examples:
          - '+1234567890'
        fallback_url:
          type: string
          description: Fallback URL that returns SWML if the primary `url` fails.
          examples:
          - https://example.com/fallback
        status_url:
          type: string
          format: uri
          description: HTTP or HTTPS URL that receives call lifecycle webhooks for events listed in `status_events`.
          examples:
          - https://example.com/status_callback
        status_events:
          type: array
          items:
            type: string
            enum:
            - created
            - ringing
            - answered
            - ended
          description: Call lifecycle events that will be delivered to `status_url`.
          examples:
          - - answered
            - ended
          default:
          - ended
        url_method:
          type: string
          enum:
          - GET
          - POST
          description: HTTP method used when requesting the `url`. Defaults to `POST`.
          examples:
          - POST
          default: POST
        codecs:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/Calling.OutboundCallCodec'
          - type: string
          description: Codecs to offer on the outbound call. May be provided as an array of enum values or a comma-separated string of the same values. If the `to` value is a SIP URI containing `codecs=...`, those take precedence.
          examples:
          - - OPUS
            - G729
            - VP8
            - PCMA
        timeout:
          type: integer
          format: int32
          minimum: 1
          maximum: 600
          description: Ring timeout in seconds. Must be between 1 and 600.
          examples:
          - 30
        max_price_per_minute:
          type: number
          format: double
          minimum: 0
          description: Maximum per-minute price (in dollars). If the computed billing route exceeds this value, the call is rejected.
          examples:
          - 0.05
        send_digits:
          type: string
          description: 'DTMF digits to send after the call is answered. Allowed characters: `0-9`, `A-D`, `*`, `#`, `w` (wait), `,` (pause).'
          examples:
          - 1234#
        region:
          anyOf:
          - type: string
          - type: array
            items:
              type: string
          description: Preferred FreeSWITCH region(s) for call routing. Must be drawn from the project's available regions. Accepts a single region or a priority-ordered array.
          examples:
          - - us-east-1
            - us-west-2
        custom_variables:
          type: object
          unevaluatedProperties:
            type: string
          maxProperties: 20
          description: 'Your own key/value string pairs to attach to the call. They become environment variables on the call''s SWML document, where you can reference them as `${envs.<key>}` — for example, to carry an order or case number through to your call logic. When SignalWire fetches your SWML document from a URL, the same pairs are also included in the `envs` object of that request.


            If a key here matches a variable you''ve already set at the account or project level, the value you pass on the request takes precedence — but only when the keys match exactly, including case. Keys are case-sensitive, so two keys that differ only in case are kept as separate variables.


            Each value must be a non-empty string of at most 1024 bytes. You can send at most 20 pairs. Each key must start with a letter or underscore and contain only letters, numbers, and underscores, and cannot begin with the reserved prefixes `signalwire_`, `sw_`, `rtc_`, or `internal_` (case-insensitive).'
          examples:
          - id: '12345'
            case_number: '54321'
        url:
          type: string
          description: 'The URL to handle the call. This parameter allows you to specify a webhook or different route in your code containing SWML instructions for handling the call.

            Either `url` or `swml` must be included for a new call.'
          examples:
          - https://example.com/swml
      unevaluatedProperties:
        not: {}
      title: dial (URL)
