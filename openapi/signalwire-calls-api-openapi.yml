      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: The unique identifying ID of a existing call.
          examples:
          - 3fa85f64-5717-4562-b3fc-2c963f66afa6
        command:
          type: string
          enum:
          - calling.stream
          description: The `calling.stream` command starts streaming call audio to a WebSocket endpoint.
          examples:
          - calling.stream
        params:
          type: object
          properties:
            control_id:
              type: string
              description: Unique identifier for this stream operation, used to control it later. Must be unique per active stream on this call.
              examples:
              - stream-control-1
            url:
              type: string
              format: uri
              description: WebSocket URL to stream audio to. Must start with `wss://` (TLS is required; plain `ws://` is rejected).
              examples:
              - wss://example.com/stream
            name:
              type: string
              description: Optional human-readable name to identify the stream at the endpoint.
              examples:
              - customer-support-recording
            codec:
              type: string
              description: Audio codec to request. Freeform; endpoint-specific. Common values include `PCMU`, `PCMA`, `OPUS`.
              examples:
              - PCMU
            track:
              allOf:
              - $ref: '#/components/schemas/Calling.StreamTrack'
              description: The audio track to stream.
              examples:
              - inbound_track
              default: inbound_track
            authorization_bearer_token:
              type: string
              description: 'Bearer token included as `Authorization: Bearer <token>` when establishing the WebSocket connection.'
              examples:
              - my-secret-token
            custom_parameters:
              type: object
              unevaluatedProperties: {}
              description: Arbitrary JSON object passed through to the WebSocket endpoint as connection metadata.
              examples:
              - session_id: abc123
            status_url:
              type: string
              format: uri
              description: HTTP or HTTPS URL that receives stream lifecycle webhooks.
              examples:
              - https://example.com/stream_callback
            status_url_method:
              allOf:
              - $ref: '#/components/schemas/Calling.StreamStatusUrlMethod'
              description: HTTP method used for the `status_url` webhook.
              examples:
              - POST
              default: POST
          required:
          - control_id
          - url
          unevaluatedProperties:
            not: {}
          description: An object of parameters that will be utilized by the active command.
      unevaluatedProperties:
        not: {}
      description: 'Stream call audio to an external WebSocket endpoint.


        Audio is sent to a `wss://` URL; `custom_parameters` pass through to the

        endpoint as connection metadata. Stream lifecycle webhooks are delivered to

        `status_url` (default method `POST`). Stop the stream with

        `calling.stream.stop` using the same `control_id`.'
      title: calling.stream
