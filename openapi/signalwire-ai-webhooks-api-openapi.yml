openapi: 3.2.0
info:
  title: SignalWire REST AI Webhooks API
  version: 1.0.0
  contact:
    name: SignalWire
    url: https://support.signalwire.com/portal/en/newticket?departmentId=1029313000000006907&layoutId=1029313000000074011
    email: support@signalwire.com
  license:
    name: MIT
    url: https://github.com/signalwire/docs/blob/main/LICENSE
  termsOfService: https://signalwire.com/legal/signalwire-cloud-agreement
  description: Callbacks an AI agent sends to your server. The same payloads apply to every surface an agent runs on — voice calls, Amazon Bedrock agents, sidecar agents, and text conversations.
servers:
- url: https://{space_name}.signalwire.com
  description: SignalWire API
  variables:
    space_name:
      default: '{Your_Space_Name}'
      description: Your SignalWire Space name
security:
- SignalWireBasicAuth: []
tags:
- name: AI Webhooks
  description: Callbacks an AI agent sends to your server. The same payloads apply to every surface an agent runs on — voice calls, Amazon Bedrock agents, sidecar agents, and text conversations.
  externalDocs:
    url: https://signalwire.com/docs/apis
    description: Developer documentation on AI webhooks
paths: {}
webhooks:
  aiDebugWebhook:
    post:
      operationId: ai_debug_webhook
      summary: AI debug webhook
      description: 'A diagnostic feed for a call that is still in progress. Set `debug_webhook_url` on your agent and

        every step it takes is posted to that URL as it happens: speech recognized, model called, tool

        invoked, context switched, error hit. Use it to work out why a call went the way it did — which

        tool the agent reached for, what came back, where a turn went wrong — or to react while the call is

        still live, such as paging a supervisor.


        Each request carries `call_info` plus one or more event properties, where the property name is the

        event. One moment can produce several: evaluating a `data_map` webhook sends `webhook`, `input`,

        `output`, `error_keys`, and `match` together. Handle the properties you recognize and ignore the

        rest, since the set grows over time.


        Setting the URL is what enables the feed. `debug_webhook_level` only widens it: at `2` it also

        carries `conversation_add`, `llm_request`, and `llm_response`, which fire on every turn and every

        model call.'
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.AiDebugWebhookPayload'
      security:
      - {}
  aiPostPromptCallback:
    post:
      operationId: ai_post_prompt_callback
      summary: AI post-prompt callback
      description: 'Sent to your [`ai.post_prompt_url`](/docs/swml/reference/calling/ai) when the AI session ends. It

        carries the agent''s answer to your [`post_prompt`](/docs/swml/reference/calling/ai)

        alongside the full record of the call: the conversation, the tool calls, the timings, and the

        token counts. This is the one report you get per call, so store the body verbatim and extract only

        the fields you query. Nothing you return in the response is read.


        Read `action` first. It is `post_conversation` on the end-of-call report described here. The same

        URL also receives `fetch_conversation` when the agent starts with a stored conversation

        ([`save_conversation`](/docs/swml/reference/calling/ai/params#paramssave_conversation) with a

        `conversation_id`), asking your endpoint to return that conversation; that request carries the

        call and session fields but none of the summary fields. Answer it with the stored

        `conversation_summary`.


        The conversation appears three times. `call_log` is the filtered view, with interrupted segments

        consolidated. `raw_call_log` is unfiltered and append-only, and is the only place barge-in detail

        survives. `call_timeline` is a flat stream of typed events aligned to `raw_call_log`.


        [`amazon_bedrock`](/docs/swml/reference/calling/amazon-bedrock) agents send a different report.

        Write your handler against the

        [Bedrock post-prompt callback](#tag/calls/webhook/bedrockPostPromptCallback) instead.'
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.AiPostPromptCallbackPayload'
      security:
      - {}
  aiSidecarCallback:
    post:
      operationId: ai_sidecar_callback
      summary: AI sidecar callback
      description: 'Sent to the sidecar''s `url` as an HTTP `POST` whenever you set one. The same event is always

        published in real time on the SignalWire Relay event channel (`calling.ai.sidecar`), so the

        webhook is optional. Each event is wrapped under `sidecar_event` — read that before checking its

        `type` and fields.


        This payload covers the envelope shared by every callback. For the fields specific to each `type`

        (such as `insight.raw`, `turn.transcript_delta`, or `final.summary`), see the

        [SWML ai_sidecar reference](/docs/swml/reference/calling/ai-sidecar#callback-types).'
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.AISidecarCallbackPayload'
      security:
      - {}
  aiSidecarSwaigToolWebhook:
    post:
      operationId: ai_sidecar_swaig_tool_webhook
      summary: AI sidecar SWAIG tool webhook
      description: "Sent to a sidecar tool's `web_hook_url` (or the SWAIG `defaults.web_hook_url`) when the sidecar\ncalls one of your functions.\n\nYour endpoint runs the function and replies with a JSON object. Both fields are optional, so `{}`\nis a valid reply:\n\n- `response` — the result the model reads next. A plain string only; the\n  `{tool_result, tool_prompt}` object form that [`ai`](/docs/swml/reference/calling/ai) agents\n  accept is not read. Omit it and the model reads a default result.\n- `action` — a single action object or an array of them. See\n  [Supported SWAIG actions](/docs/swml/reference/calling/ai-sidecar#supported-swaig-actions) for\n  what you can return.\n\nThere is no `post_process` on a sidecar reply.\n\nThe sidecar only listens to the call and never speaks on it, so a `say` action is reported back to\nyou as a callback rather than being spoken aloud."
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.AISidecarSwaigToolWebhookPayload'
      security:
      - {}
  aiSwaigToolWebhook:
    post:
      operationId: ai_swaig_tool_webhook
      summary: AI SWAIG tool webhook
      description: "Sent to a tool's `web_hook_url` (or the SWAIG `defaults.web_hook_url`) when an\n[`ai`](/docs/swml/reference/calling/ai) agent calls one of your functions.\n\nYour endpoint runs the function and replies with a JSON object — the same shape a `data_map`\noutput produces, because the platform reads both the same way. Every field is optional, so `{}` is\na valid reply and a handler that only steers the call can return `action` alone:\n\n- `response` — the result the agent reads next, written to the AI rather than spoken to the\n  caller. A plain string becomes the tool message as-is; the object form\n  `{tool_result, tool_prompt}` splits the data half from the steering half. Omit it and the agent\n  reads a default result.\n- `action` — a single action object or an array of them, executed on the live call.\n- `post_process` — hold the actions until after the agent has spoken. **Default:** `false`."
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.AiSwaigToolWebhookPayload'
      security:
      - {}
  bedrockPostPromptCallback:
    post:
      operationId: bedrock_post_prompt_callback
      summary: Amazon Bedrock post-prompt callback
      description: 'Sent to your [`amazon_bedrock.post_prompt_url`](/docs/swml/reference/calling/amazon-bedrock) when

        the agent''s session ends, carrying its answer to your `post_prompt` alongside the record of the

        call. Nothing you return in the response is read.


        Bedrock agents send a different report from [`ai`](/docs/swml/reference/calling/ai) agents. There

        is no `call_timeline`, `previous_contexts`, `hard_timeout`, `call_ended_by`, or `ai_id_tag`;

        `raw_call_log` is a copy of `call_log` rather than a separate unfiltered view; `swaig_log` is

        always empty; `conversation_summary` is always present; and the `total_*` fields arrive without

        your having to enable accounting. `post_prompt_url` also takes no separate credentials here — put

        them in the URL as `username:password@url`. Write your handler against this payload, not the

        [AI post-prompt callback](#tag/calls/webhook/aiPostPromptCallback).'
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.BedrockPostPromptCallbackPayload'
      security:
      - {}
  bedrockSwaigToolWebhook:
    post:
      operationId: bedrock_swaig_tool_webhook
      summary: Amazon Bedrock SWAIG tool webhook
      description: "Sent to a tool's `web_hook_url` (or the SWAIG `defaults.web_hook_url`) when an\n[`amazon_bedrock`](/docs/swml/reference/calling/amazon-bedrock) agent calls one of your functions.\nYour endpoint runs the function and replies with a JSON object. Both fields are optional, so `{}`\nis a valid reply:\n\n- `response` — the result the agent reads next. A plain string only here; the\n  `{tool_result, tool_prompt}` object form that [`ai`](/docs/swml/reference/calling/ai) agents\n  accept is not read. Omit it and the agent reads a default result.\n- `action` — a single action object or an array of them, executed on the live call.\n\nThere is no `post_process`: a Bedrock agent always defers actions until after it has spoken.\n\nBedrock agents send a different payload from [`ai`](/docs/swml/reference/calling/ai) agents. Notably\n`content_type` is `text/json` rather than `text/swaig`, `argument` carries no `substituted` value,\nthere is no `version`, `description`, or `argument_desc`, and the call's timing and caller fields\nare named differently. Write your handler against this payload, not the\n[AI SWAIG tool webhook](#tag/calls/webhook/aiSwaigToolWebhook)."
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.BedrockSwaigToolWebhookPayload'
      security:
      - {}
  swaigSignatureRequest:
    post:
      operationId: swaig_signature_request
      summary: SWAIG function signature request
      description: "Sent once per [`SWAIG.includes`](/docs/swml/reference/calling/ai/swaig/includes) entry when an AI\nagent loads, to discover the functions your server hosts. Every way of building an agent sends it —\nSWML you write yourself, SWML a Server SDK generates, or an agent you configure in your Dashboard —\nbecause they all resolve `includes` the same way.\n\nReply with the function definitions you host, each shaped like an entry in\n[`SWAIG.functions`](/docs/swml/reference/calling/ai/swaig/functions#properties) — `function`,\n`description`, and `parameters`. Three forms are accepted:\n\n- an array of definitions, the usual one;\n- a single definition on its own;\n- an object `{functions, defaults}`, where `defaults` sets SWAIG defaults across the definitions\n  it carries — useful when they share a `web_hook_url` or auth.\n\nEvery definition you return is registered, whether or not it was named in the request's\n`functions` list.\n\nThis is not the payload a function call sends. It goes to the `includes` entry's `url`, using\n`auth_user` and `auth_password` when set. Your endpoint can also receive it outside of a call, as a\ncheck that it answers, so answer it the same way. When your project has a signing key, the request\ncarries an `X-SignalWire-Signature` header you can verify."
      parameters: []
      responses:
        '200':
          description: Webhook received
      tags:
      - AI Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Webhooks.AI.SwaigSignatureRequestPayload'
      security:
      - {}
components:
  schemas:
    Webhooks.AI.AICallTimelineEntry:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: 'What happened. `user_input`, `ai_response`, and `tool_result` cover the conversation; `pronounce`

            and `text_normalize` record text rewrites; anything else is the name of a logged action.'
          examples:
          - ai_response
        ts:
          type: number
          description: When it happened, as a Unix timestamp in microseconds. Omitted when the source entry had no timestamp.
          examples:
          - 1694541297950440
      unevaluatedProperties: {}
      description: One event on the call, in order. Beyond `type`, an entry carries the fields belonging to that type.
    Webhooks.AI.BedrockPostPromptCallbackPayload:
      type: object
      required:
      - content_type
      - content_disposition
      - conversation_type
      - call_id
      - app_name
      - ai_session_id
      - action
      - call_log
      - raw_call_log
      - post_prompt_data
      - global_data
      - swaig_log
      - conversation_summary
      properties:
        project_id:
          type: string
          description: Your project ID, when available.
          examples:
          - 4d0d6f16-5881-4fcc-92a4-02c51a91954d
        space_id:
          type: string
          description: Your Space ID, when available.
          examples:
          - 451ed9ff-e568-4222-8af9-4f9ab7428d09
        content_type:
          type: string
          description: The content type of the request body. Always `text/json`.
          examples:
          - text/json
        content_disposition:
          type: string
          description: How the body is delivered. Always `agent.summary` for the end-of-call report.
          examples:
          - agent.summary
        conversation_type:
          type: string
          description: The kind of conversation the agent ran. Always `voice`.
          examples:
          - voice
        call_id:
          type: string
          description: The ID of the call.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        app_name:
          type: string
          description: The name of your Bedrock application. Defaults to `bedrock`.
          examples:
          - bedrock
        ai_session_id:
          type: string
          description: The ID of the AI session on the call. Matches `call_id` for Bedrock agents.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        conversation_id:
          type: string
          description: The conversation ID, when the agent was configured with one.
          examples:
          - support-thread-4821
        action:
          type: string
          description: What the request is asking of you. Always `post_conversation` for the end-of-call report.
          examples:
          - post_conversation
        call_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AICallLogEntry'
          description: 'The conversation. Each entry carries a `role` of `system`, `user`, or `assistant` and its

            `content`.'
          examples:
          - - role: system
              content: You dispatch taxis.
            - role: user
              content: I need a ride to the airport.
        raw_call_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AICallLogEntry'
          description: A copy of `call_log`. Bedrock agents do not keep a separate unfiltered log.
        call_start_date:
          type: integer
          format: int64
          description: When the call was created, as a Unix timestamp in microseconds.
          examples:
          - 1694541295773508
        call_answer_date:
          type: integer
          format: int64
          description: When the call was answered, as a Unix timestamp in microseconds. `0` when it never was.
          examples:
          - 1694541296799504
        call_end_date:
          type: integer
          format: int64
          description: When the call ended, as a Unix timestamp in microseconds. `0` while the call is still up.
          examples:
          - 1694541335435503
        ai_start_date:
          type: integer
          format: int64
          description: When the agent started, as a Unix timestamp in microseconds.
          examples:
          - 1694541297950440
        ai_end_date:
          type: integer
          format: int64
          description: When the agent stopped, as a Unix timestamp in microseconds. Omitted while it is still running.
          examples:
          - 1694541335425164
        caller_id_name:
          type: string
          description: The caller's name, when available.
          examples:
          - Jane Doe
        caller_id_number:
          type: string
          description: The caller's number, when available.
          examples:
          - '+15555550100'
        times:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AIResponseTiming'
          description: Per-response performance metrics, one entry per generated reply. Included once the agent has any.
        total_minutes:
          type: number
          description: 'The number of billable minutes, with a minimum of one. Fractional durations are kept as they are;

            only a call under a minute is raised to `1`. Included once the agent has stopped.'
          examples:
          - 3.14
        total_input_tokens:
          type: integer
          description: Input tokens the session consumed. Included once the agent has stopped.
          examples:
          - 5627
        total_output_tokens:
          type: integer
          description: Output tokens the session produced. Included once the agent has stopped.
          examples:
          - 119
        total_wire_input_tokens:
          type: integer
          description: A copy of `total_input_tokens`. Included once the agent has stopped.
          examples:
          - 5627
        total_wire_input_tokens_per_minute:
          type: number
          description: '`total_input_tokens` divided by `total_minutes`. Included once the agent has stopped.'
          examples:
          - 1792.04
        total_wire_output_tokens:
          type: integer
          description: A copy of `total_output_tokens`. Included once the agent has stopped.
          examples:
          - 119
        total_wire_output_tokens_per_minute:
          type: number
          description: '`total_output_tokens` divided by `total_minutes`. Included once the agent has stopped.'
          examples:
          - 37.9
        total_tts_chars:
          type: integer
          description: Characters sent to text-to-speech. Included once the agent has stopped.
          examples:
          - 842
        total_tts_chars_per_min:
          type: number
          description: '`total_tts_chars` divided by `total_minutes`. Included once the agent has stopped.'
          examples:
          - 268.15
        total_asr_minutes:
          type: number
          description: Minutes of audio sent to speech recognition. Included once the agent has stopped.
          examples:
          - 2.41
        total_asr_cost_factor:
          type: number
          description: Always `1`. Bedrock agents do not vary the factor. Included once the agent has stopped.
          examples:
          - 1
        SWMLVars:
          type: object
          unevaluatedProperties: {}
          description: SWML variables for the call. Included when the call carries SWML state.
        SWMLCall:
          type: object
          unevaluatedProperties: {}
          description: SWML call state. Included when the call carries SWML state.
        post_prompt_data:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AIPostPromptData'
          description: The agent's answer to your `post_prompt`.
        global_data:
          type: object
          unevaluatedProperties: {}
          description: The session's final `global_data`. An empty object when you seeded none.
          examples:
          - customer_tier: premium
        swaig_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AISwaigLogEntry'
          description: Always an empty array. Bedrock agents do not report a tool-call log.
          examples:
          - []
        conversation_summary:
          type: string
          description: The agent's answer to your `post_prompt`, as plain text.
          examples:
          - Caller booked a ride from 123 Main St to the airport for 6pm.
      unevaluatedProperties:
        not: {}
    Webhooks.AI.AiPostPromptCallbackPayload:
      type: object
      required:
      - content_type
      - content_disposition
      - conversation_type
      - call_id
      - app_name
      - ai_session_id
      - action
      properties:
        project_id:
          type: string
          description: Your project ID, when available.
          examples:
          - 4d0d6f16-5881-4fcc-92a4-02c51a91954d
        space_id:
          type: string
          description: Your Space ID, when available.
          examples:
          - 451ed9ff-e568-4222-8af9-4f9ab7428d09
        content_type:
          type: string
          description: The content type of the request body. Always `text/json`.
          examples:
          - text/json
        content_disposition:
          type: string
          description: 'How the body is delivered. `agent.summary` on the end-of-call report, `agent.load_conversation`

            on a request for a stored conversation.'
          examples:
          - agent.summary
        conversation_type:
          type: string
          enum:
          - voice
          - chat
          description: 'The kind of conversation the agent ran: a call, or a text conversation held over the

            [AI chat endpoint](/docs/apis/rest/ai-chat/chat-methods).'
          examples:
          - voice
        call_id:
          type: string
          description: The ID of the call. On a chat conversation this carries the conversation id instead.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        app_name:
          type: string
          description: The name of your AI application.
          examples:
          - ai
        ai_session_id:
          type: string
          description: The ID of the AI session on the call.
          examples:
          - a0d4e6e5-5d07-413d-9668-55542992eec0
        ai_id_tag:
          type: string
          description: 'A stable fingerprint of the model the agent ran. Two calls that used the same model share it, so

            you can group reports by model without recording the model name. Omitted when the session had no

            model.'
          examples:
          - d742c5d1d969d9fdbbd9bd1c52499f2d
        conversation_id:
          type: string
          description: The conversation ID, when the agent was configured with one.
          examples:
          - support-thread-4821
        action:
          type: string
          enum:
          - post_conversation
          - fetch_conversation
          description: 'What the request is asking of you. `post_conversation` is the end-of-call report;

            `fetch_conversation` asks your endpoint to return a stored conversation.'
          examples:
          - post_conversation
        call_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AICallLogEntry'
          description: 'The conversation, filtered: interrupted segments are consolidated and evicted entries dropped.

            Included when `action` is `post_conversation`.'
          examples:
          - - role: system
              content: You dispatch taxis.
            - role: user
              content: I need a ride to the airport.
        raw_call_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AICallLogEntry'
          description: 'The conversation, unfiltered and append-only. Interruption detail appears here and nowhere else.

            Included when `action` is `post_conversation`.'
        call_timeline:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AICallTimelineEntry'
          description: 'A flat stream of typed events aligned to `raw_call_log`, for replaying the call in order.

            Included when the session produced any.'
        previous_contexts:
          type: array
          items:
            type: array
            items:
              type: object
              unevaluatedProperties: {}
          description: 'Conversations from before each context switch, oldest first, one array of messages per switch.

            Included only when the agent switched context during the call.'
        hard_timeout:
          type: boolean
          description: 'Always `true` when present, meaning the session ended because it hit its configured time limit

            rather than finishing on its own. Omitted otherwise.'
          examples:
          - true
        call_start_date:
          type: integer
          format: int64
          description: When the call was created, as a Unix timestamp in microseconds.
          examples:
          - 1694541295773508
        call_answer_date:
          type: integer
          format: int64
          description: When the call was answered, as a Unix timestamp in microseconds. `0` when it never was.
          examples:
          - 1694541296799504
        call_end_date:
          type: integer
          format: int64
          description: When the call ended, as a Unix timestamp in microseconds.
          examples:
          - 1694541335435503
        ai_start_date:
          type: integer
          format: int64
          description: When the AI session started, as a Unix timestamp in microseconds.
          examples:
          - 1694541297950440
        call_ended_by:
          type: string
          description: Who or what ended the call. Included when the session recorded it.
          examples:
          - assistant
        ai_end_date:
          type: integer
          format: int64
          description: 'When the AI session ended, as a Unix timestamp in microseconds. Omitted when the session was

            still running.'
          examples:
          - 1694541335425164
        caller_id_name:
          type: string
          description: The caller's name, when available.
          examples:
          - Jane Doe
        caller_id_number:
          type: string
          description: The caller's number, when available.
          examples:
          - '+15555550100'
        times:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AIResponseTiming'
          description: 'Per-response performance metrics, one entry per generated reply. Included once the session has

            any.'
        SWMLVars:
          type: object
          unevaluatedProperties: {}
          description: SWML variables for the call. Included when the call carries SWML state.
        SWMLCall:
          type: object
          unevaluatedProperties: {}
          description: SWML call state. Included when the call carries SWML state.
        post_prompt_data:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AIPostPromptData'
          description: The agent's answer to your `post_prompt`. Included when `action` is `post_conversation`.
        global_data:
          type: object
          unevaluatedProperties: {}
          description: 'The session''s final `global_data`. Alongside anything you seeded, the session adds

            `caller_id_name` and `caller_id_number` when the call carries them. Included when `action` is

            `post_conversation`.'
          examples:
          - customer_tier: premium
            pickup_address: 123 Main St, Springfield
        swaig_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AISwaigLogEntry'
          description: Every tool call the agent made, in order. Included when `action` is `post_conversation`.
        total_minutes:
          type: integer
          description: 'The number of billable minutes, rounded up to at least one. Included when you enable

            [`enable_accounting`](/docs/swml/reference/calling/ai/params#paramsenable_accounting).'
          examples:
          - 3
        total_input_tokens:
          type: integer
          description: Input tokens the session consumed. Included when you enable `enable_accounting`.
          examples:
          - 5627
        total_output_tokens:
          type: integer
          description: Output tokens the session produced. Included when you enable `enable_accounting`.
          examples:
          - 119
        total_wire_input_tokens:
          type: integer
          description: 'Input tokens counted against the model, which differs from `total_input_tokens` when the

            conversation was trimmed. Included when you enable `enable_accounting`.'
          examples:
          - 5627
        total_wire_input_tokens_per_minute:
          type: number
          description: '`total_wire_input_tokens` divided by `total_minutes`. Included when you enable `enable_accounting`.'
          examples:
          - 1875.67
        total_wire_output_tokens:
          type: integer
          description: Output tokens counted against the model. Included when you enable `enable_accounting`.
          examples:
          - 119
        total_wire_output_tokens_per_minute:
          type: number
          description: '`total_wire_output_tokens` divided by `total_minutes`. Included when you enable `enable_accounting`.'
          examples:
          - 39.67
        total_tts_chars:
          type: integer
          description: Characters sent to text-to-speech. Included when you enable `enable_accounting`.
          examples:
          - 842
        total_tts_chars_per_min:
          type: number
          description: '`total_tts_chars` divided by `total_minutes`. Included when you enable `enable_accounting`.'
          examples:
          - 280.67
        total_asr_minutes:
          type: number
          description: Minutes of audio sent to speech recognition. Included when you enable `enable_accounting`.
          examples:
          - 2.41
        total_asr_cost_factor:
          type: number
          description: '`total_asr_minutes` divided by `total_minutes`. Included when you enable `enable_accounting`.'
          examples:
          - 0.8
        conversation_summary:
          type: string
          description: 'A plain-language summary of the conversation, for storing against `conversation_id` and handing

            back on the next `fetch_conversation`. Included when you enable

            [`save_conversation`](/docs/swml/reference/calling/ai/params#paramssave_conversation) and set

            a `conversation_id`.'
          examples:
          - Caller booked a ride from 123 Main St to the airport for 6pm.
      unevaluatedProperties:
        not: {}
    Webhooks.AI.AIPostPromptData:
      type: object
      required:
      - parsed
      - raw
      properties:
        parsed:
          type: array
          items:
            type: object
            unevaluatedProperties: {}
          description: 'Every JSON object found in the answer, parsed. An empty array when the agent answered in prose.

            Ask the post-prompt for named JSON keys when you want to count outcomes.'
          examples:
          - - intent: book_ride
              resolved: true
        raw:
          type: string
          description: The answer exactly as the agent produced it.
          examples:
          - '{"intent":"book_ride","resolved":true}'
        substituted:
          type: string
          description: 'The answer with the JSON removed, leaving only the surrounding prose. Omitted when the answer was

            JSON and nothing followed it.'
          examples:
          - Caller booked a ride to the airport.
      unevaluatedProperties:
        not: {}
      description: 'The answer an AI agent gave to your

        [`post_prompt`](/docs/swml/reference/calling/ai), in three forms.'
    Webhooks.AI.AISidecarEvent:
      type: object
      required:
      - type
      - ts
      - tick_id
      - channel_data
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AISidecarCallbackType'
          description: The callback type.
          examples:
          - insight
        ts:
          type: integer
          format: int64
          description: When the event was produced, as a Unix timestamp in microseconds.
          examples:
          - 1745870400123456
        tick_id:
          type: integer
          format: int64
          description: Identifies the evaluation this callback came from. Callbacks produced in the same evaluation share a `tick_id`.
          examples:
          - 7
        channel_data:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AISidecarChannelData'
          description: Identifies the call the event came from.
      unevaluatedProperties: {}
      description: 'One sidecar callback. Every event carries the four fields below; `type` decides what else comes

        with it, so read `type` first and expect properties beyond these.'
    Webhooks.AI.AICallInfo:
      type: object
      required:
      - call_id
      - content_type
      - content_disposition
      - conversation_type
      properties:
        project_id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Your project ID.
          examples:
          - 4d0d6f16-5881-4fcc-92a4-02c51a91954d
        space_id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Your Space ID.
          examples:
          - 451ed9ff-e568-4222-8af9-4f9ab7428d09
        call_id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: ID of the call.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        content_type:
          type: string
          description: The content type of the POST body. Always `text/json`.
          examples:
          - text/json
        content_disposition:
          type: string
          description: How the body is delivered. Always `post_data`.
          examples:
          - post_data
        conversation_type:
          type: string
          description: The conversation type. Always `voice`.
          examples:
          - voice
      unevaluatedProperties:
        not: {}
      description: 'Identifies the call an AI callback came from. `project_id` and `space_id` are included when

        available.'
    Webhooks.AI.BedrockSwaigToolWebhookPayload:
      type: object
      required:
      - function
      - argument
      - call_id
      - ai_session_id
      - app_name
      - caller_id
      - global_data
      - content_type
      - content_disposition
      - conversation_type
      - action
      - meta_data_token
      - meta_data
      properties:
        function:
          type: string
          description: The name of the function the agent is calling.
          examples:
          - get_weather
        argument:
          type: object
          properties:
            parsed:
              type: array
              items:
                type: object
                unevaluatedProperties: {}
              description: The arguments parsed into objects. Usually a single-element array.
              examples:
              - - city: San Francisco
            raw:
              type: string
              description: The raw argument string, exactly as the agent produced it.
              examples:
              - '{"city":"San Francisco"}'
          required:
          - parsed
          - raw
          unevaluatedProperties:
            not: {}
          description: The arguments the agent passed to your function.
        call_id:
          type: string
          description: The ID of the call.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        ai_session_id:
          type: string
          description: The ID of the AI session on the call. Matches `call_id` for Bedrock agents.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        app_name:
          type: string
          description: The name of your Bedrock application. Defaults to `bedrock`.
          examples:
          - bedrock
        caller_id:
          type: string
          description: The caller's number. An empty string when the call has none.
          examples:
          - '+15555550100'
        global_data:
          type: object
          unevaluatedProperties: {}
          description: 'The agent''s current `global_data`. Alongside anything you seeded, the session adds

            `caller_id_name` and `caller_id_number` when the call carries them.'
          examples:
          - customer_tier: premium
            pickup_address: 123 Main St, Springfield
        content_type:
          type: string
          description: The content type of the request body. Always `text/json`.
          examples:
          - text/json
        content_disposition:
          type: string
          description: How the body is delivered. Always `agent.function` for a function call.
          examples:
          - agent.function
        conversation_type:
          type: string
          description: The kind of conversation the agent is running. Always `voice`.
          examples:
          - voice
        action:
          type: string
          description: 'What the request is asking of you. Always `fetch_conversation` for a function call; the

            end-of-call conversation report sends `post_conversation` instead.'
          examples:
          - fetch_conversation
        project_id:
          type: string
          description: Your project ID, when available.
          examples:
          - 4d0d6f16-5881-4fcc-92a4-02c51a91954d
        space_id:
          type: string
          description: Your Space ID, when available.
          examples:
          - 451ed9ff-e568-4222-8af9-4f9ab7428d09
        conversation_id:
          type: string
          description: The conversation ID, when the agent was configured with one.
        caller_id_name:
          type: string
          description: The caller's name, when available.
          examples:
          - Jane Doe
        caller_id_number:
          type: string
          description: The caller's number, when available.
          examples:
          - '+15555550100'
        call_start_date:
          type: integer
          format: int64
          description: When the call was created, as a Unix timestamp in microseconds.
        call_answer_date:
          type: integer
          format: int64
          description: When the call was answered, as a Unix timestamp in microseconds. `0` when it never was.
        call_end_date:
          type: integer
          format: int64
          description: When the call ended, as a Unix timestamp in microseconds. `0` while the call is still up.
        ai_start_date:
          type: integer
          format: int64
          description: When the agent started, as a Unix timestamp in microseconds.
        ai_end_date:
          type: integer
          format: int64
          description: When the agent stopped, as a Unix timestamp in microseconds. Omitted while it is still running.
        times:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AIResponseTiming'
          description: Per-response performance metrics for the session so far. Included once the agent has any.
        SWMLVars:
          type: object
          unevaluatedProperties: {}
          description: SWML variables for the call. Included when the call carries SWML state.
        SWMLCall:
          type: object
          unevaluatedProperties: {}
          description: SWML call state. Included when the call carries SWML state.
        meta_data_token:
          type: string
          description: 'The token that scopes `meta_data`. This is the `meta_data_token` you set on the function, or an

            MD5 of the function''s name when you did not set one.'
          examples:
          - d742c5d1d969d9fdbbd9bd1c52499f2d
        meta_data:
          type: object
          unevaluatedProperties: {}
          description: Metadata scoped to `meta_data_token`. An empty object when the function has none yet.
          examples:
          - order_number: '12345'
      unevaluatedProperties:
        not: {}
    uuid:
      type: string
      format: uuid
      description: Universal Unique Identifier.
    Webhooks.AI.AICallLogEntry:
      type: object
      required:
      - role
      - content
      properties:
        role:
          type: string
          description: 'Who produced the entry. Common roles include `system`, `user`, `assistant`, and `tool`. Other

            roles may appear, so filter to the roles your application uses rather than assuming a fixed set.'
          examples:
          - assistant
        content:
          type: string
          description: The text of the entry.
          examples:
          - Your ride is booked for 6pm.
        timestamp:
          type: integer
          format: int64
          description: When the entry was added, as a Unix timestamp in microseconds. Omitted on entries without one.
          examples:
          - 1694541297950440
        tool_calls:
          type: array
          items:
            type: object
            unevaluatedProperties: {}
          description: The tool calls the agent made on this turn. Present only on a turn that made any.
      unevaluatedProperties: {}
      description: 'One entry in the conversation. Beyond `role` and `content`, an entry carries whatever per-turn

        detail applies to it, such as recognition confidence on a caller turn or timings on a reply.'
    Webhooks.AI.AISidecarCallbackType:
      type: string
      enum:
      - start
      - turn
      - request
      - thought
      - insight
      - skip
      - tool_call
      - tool_result
      - action
      - global_data_change
      - history_pruned
      - error
      - ask_request
      - ask_answer
      - stop
      - final
      description: 'The kind of AI sidecar callback. See the

        [SWML ai_sidecar reference](/docs/swml/reference/calling/ai-sidecar#callback-types)

        for the type-specific fields each one carries.'
    Webhooks.AI.AiDebugWebhookPayload:
      type: object
      required:
      - call_info
      properties:
        call_info:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AICallInfo'
          description: Identifies the call the event came from.
        session_start:
          type: object
          properties:
            model:
              type: string
              description: The model the agent is running. `unknown` on a speech-to-speech session with no model set.
              examples:
              - gpt-4.1-mini
            tts_engine:
              type: string
              description: The text-to-speech engine. Standard sessions only, and only when a voice is configured.
              examples:
              - elevenlabs
            tts_voice:
              type: string
              description: The text-to-speech voice. Standard sessions only, and only when a voice is configured.
              examples:
              - rachel
            language:
              type: string
              description: The language code the session started in. Standard sessions only, and only when a voice is configured.
              examples:
              - en-US
            mode:
              type: string
              description: Always `oart` when present, marking a speech-to-speech session. Absent on a standard session.
              examples:
              - oart
            rate:
              type: integer
              description: The audio sample rate, in hertz. Speech-to-speech sessions only.
              examples:
              - 24000
            audio_format:
              type: string
              description: The audio encoding. Speech-to-speech sessions only.
              examples:
              - pcm16
            tool_model:
              type: string
              description: The separate model used for tool calls. Speech-to-speech sessions only, and only when one is configured.
              examples:
              - gpt-4.1-mini
            local_vad:
              type: boolean
              description: 'Always `true` when present, meaning voice activity detection runs on the media rather than at

                the model. Speech-to-speech sessions only.'
              examples:
              - true
          unevaluatedProperties:
            not: {}
          description: 'The AI session started. Sent once per session. The fields differ by session type: a standard

            session reports the voice it will use, while a speech-to-speech session reports `mode` as `oart`

            along with its audio settings and reports no voice at all. Every field is optional, so read

            `mode` to tell which kind of session you have.'
        session_end:
          type: object
          properties:
            reason:
              type: string
              enum:
              - normal
              - hard_timeout
              - end_call
              - error
              description: 'Why the session ended. `normal` on an ordinary finish, `hard_timeout` when it hit its

                configured time limit, and `end_call` or `error` on a speech-to-speech session that was hung up

                or failed.'
              examples:
              - normal
            ended_by:
              type: string
              description: 'Who or what ended the call, `system` when nothing recorded it. Absent on a speech-to-speech

                session.'
              examples:
              - assistant
            fatal_error_reason:
              type: string
              description: A description of the error. Included only when the session ended on one.
            duration_ms:
              type: integer
              description: How long the session ran, in milliseconds.
              examples:
              - 37651
            input_tokens:
              type: integer
              description: Input tokens the session consumed.
              examples:
              - 5627
            output_tokens:
              type: integer
              description: Output tokens the session produced.
              examples:
              - 119
          required:
          - reason
          - duration_ms
          - input_tokens
          - output_tokens
          unevaluatedProperties:
            not: {}
          description: The AI session ended. Sent once per session.
        startup_hook:
          type: object
          properties:
            duration_ms:
              type: integer
              description: How long the hook took, in milliseconds.
              examples:
              - 214
            success:
              type: boolean
              description: Whether the hook ran successfully.
              examples:
              - true
            error:
              type: string
              description: Why the hook failed. Included only when `success` is `false`.
              examples:
              - execution failed
          required:
          - duration_ms
          - success
          unevaluatedProperties:
            not: {}
          description: Your `startup_hook` function finished, whether or not it succeeded.
        hangup_hook:
          type: object
          properties:
            duration_ms:
              type: integer
              description: How long the hook took, in milliseconds.
              examples:
              - 186
            success:
              type: boolean
              description: Whether the hook ran successfully.
              examples:
              - true
            has_fatal_error:
              type: boolean
              description: Whether the session ended on an unrecoverable error. Included only when the hook succeeded.
              examples:
              - false
            error:
              type: string
              description: Why the hook failed. Included only when `success` is `false`.
              examples:
              - execution failed
          required:
          - duration_ms
          - success
          unevaluatedProperties:
            not: {}
          description: Your `hangup_hook` function finished, whether or not it succeeded.
        speech_detect:
          type: object
          properties:
            text:
              type: string
              description: The recognized text.
              examples:
              - I need a ride to the airport.
            source:
              type: string
              description: Which recognizer produced the text.
              examples:
              - final
          required:
          - text
          - source
          unevaluatedProperties:
            not: {}
          description: Speech was recognized from the caller. Suppressed when you enable `redact_prompt`.
        barge:
          type: object
          properties:
            barge_type:
              type: string
              enum:
              - transparent
              - normal
              description: '`transparent` when the agent keeps what it already said, `normal` otherwise.'
              examples:
              - normal
            barge_elapsed_ms:
              type: integer
              description: How long the agent had been speaking when the caller cut in, in milliseconds.
              examples:
              - 1240
            interrupt_count:
              type: integer
              description: How many times the caller has interrupted so far.
              examples:
              - 2
            audio_played_ms:
              type: integer
              description: How much of the reply had played when the caller cut in, in milliseconds. Speech-to-speech sessions only.
              examples:
              - 1240
            barge_count:
              type: integer
              description: How many times the caller has interrupted so far. Speech-to-speech sessions only.
              examples:
              - 2
          unevaluatedProperties:
            not: {}
          description: 'The caller interrupted the agent. The fields differ by session type: a standard session reports

            `barge_type`, `barge_elapsed_ms`, and `interrupt_count`, while a speech-to-speech session reports

            `audio_played_ms` and `barge_count`.'
        ai_completion:
          type: object
          properties:
            type:
              type: string
              enum:
              - normal
              - barged
              description: '`barged` when the caller interrupted the reply, `normal` when it played to the end.'
              examples:
              - normal
          required:
          - type
          unevaluatedProperties:
            not: {}
          description: The agent finished speaking a reply.
        filler:
          type: object
          properties:
            text:
              type: string
              description: The phrase that was spoken.
              examples:
              - Let me check on that.
            filler_type:
              type: string
              enum:
              - function
              - thinking
              description: '`function` while a tool runs, `thinking` while the model does.'
              examples:
              - function
          required:
          - text
          - filler_type
          unevaluatedProperties:
            not: {}
          description: The agent played a filler phrase while it worked.
        attention_timeout:
          anyOf:
          - type: object
            properties:
              timeout_ms:
                type: integer
                description: The configured timeout, in milliseconds.
                examples:
                - 15000
            required:
            - timeout_ms
            unevaluatedProperties:
              not: {}
          - type: 'null'
          description: The caller went quiet for longer than `attention_timeout`. Sent as `null` on speech-to-speech sessions.
        hold:
          type: object
          properties:
            event:
              type: string
              enum:
              - hold
              - unhold
              description: Which way the hold went.
              examples:
              - hold
            timeout:
              type: integer
              description: How long the hold lasts, in seconds. Absent on `unhold`.
              examples:
              - 30
            loop:
              type: boolean
              description: Whether the hold repeats. Absent on `unhold`.
              examples:
              - false
          required:
          - event
          unevaluatedProperties:
            not: {}
          description: The agent was placed on hold, or taken off it. `timeout` and `loop` come with `hold` only.
        function_call:
          type: object
          properties:
            function:
              type: string
              description: The name of the function.
              examples:
              - get_weather
            duration_ms:
              type: integer
              description: How long the function took, in milliseconds.
              examples:
              - 412
            native:
              type: boolean
              description: 'Whether the function ran inside the platform rather than on your server. Absent on a

                speech-to-speech shadow call, which reports `shadow` instead.'
              examples:
              - false
            shadow:
              type: boolean
              description: 'Always `true` when present, marking a call the agent made in the background while it kept

                talking. Speech-to-speech sessions only.'
              examples:
              - true
            phase:
              type: string
              description: Where in the session the call happened. Included only for a call made while running the post-prompt.
              examples:
              - post_prompt
          required:
          - function
          - duration_ms
          unevaluatedProperties:
            not: {}
          description: The agent called one of your functions and the call returned.
        function_loop:
          type: object
          properties:
            function:
              type: string
              description: The name of the function.
              examples:
              - get_weather
            type:
              type: string
              enum:
              - consecutive
              - repeated
              description: Which loop guard tripped.
              examples:
              - repeated
            count:
              type: integer
              description: How many calls triggered the guard.
              examples:
              - 3
          required:
          - function
          - type
          - count
          unevaluatedProperties:
            not: {}
          description: 'The agent called the same function repeatedly and was stopped. `consecutive` means it was called

            several times in a row; `repeated` means it was called with the same arguments each time.'
        swaig_call:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AISwaigLogEntry'
          description: A completed tool call, the same entry the post-prompt callback later reports in its `swaig_log`.
        process_action:
          type: object
          unevaluatedProperties: {}
          description: A tool returned a SWAIG action. Carries the action exactly as your endpoint returned it.
        tool_distill:
          type: object
          properties:
            function:
              type: string
              description: The function whose result was shortened.
              examples:
              - get_weather
            raw_chars:
              type: integer
              description: Length of the original result, in characters.
              examples:
              - 8412
            distilled_chars:
              type: integer
              description: Length of the shortened result, in characters.
              examples:
              - 612
            model:
              type: string
              description: The model that did the shortening. `default` when none was configured.
              examples:
              - gpt-4.1-mini
          required:
          - function
          - raw_chars
          - distilled_chars
          - model
          unevaluatedProperties:
            not: {}
          description: A tool result was shortened before the agent read it.
        webhook:
          type: object
          unevaluatedProperties: {}
          description: 'The webhook definition as you wrote it. Arrives alongside `input`, and alongside `output` and

            `match` when the call produced a reply, or `error` when the definition was unusable.'
        input:
          type: object
          unevaluatedProperties: {}
          description: The body sent to the webhook, or the input an output template was expanded against.
        output:
          anyOf:
          - type: object
            unevaluatedProperties: {}
          - type: 'null'
          description: The reply the webhook produced, or the output template that matched. `null` when nothing matched.
        match:
          anyOf:
          - type: object
            unevaluatedProperties: {}
          - type: 'null'
          description: The entry that matched. `null` when none did.
        error_keys:
          anyOf:
          - type: array
            items: {}
          - type: 'null'
          description: The `error_keys` declared on the webhook. `null` when it declares none.
        error:
          type: object
          properties:
            error:
              type: string
              description: What went wrong.
              examples:
              - 'ai: webhook error'
            errorText:
              type: string
              description: The detail behind it.
              examples:
              - Webhook obj must have output or expressions
          required:
          - error
          - errorText
          unevaluatedProperties:
            not: {}
          description: The webhook could not be evaluated.
        expression:
          type: object
          unevaluatedProperties: {}
          description: The `expressions` entry as you wrote it. Arrives alongside `input` and `output`.
        webhook_log:
          type: object
          properties:
            request_url:
              type: string
              description: The URL that was called, after variable expansion.
