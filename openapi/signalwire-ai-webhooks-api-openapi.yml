      unevaluatedProperties:
        not: {}
    Webhooks.AI.AISidecarChannelData:
      type: object
      properties:
        call_id:
          type: string
          description: ID of the call the sidecar is attached to.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        caller_id_name:
          type: string
          description: The caller's name.
          examples:
          - Jane Doe
        caller_id_number:
          type: string
          description: The caller's number.
          examples:
          - '+15555550100'
        destination_number:
          type: string
          description: The number that was called.
          examples:
          - '+15555550199'
      unevaluatedProperties:
        not: {}
      description: Identifies the call a sidecar callback came from. Each field is included when the call has it.
    Webhooks.AI.AIResponseTiming:
      type: object
      required:
      - response
      - response_word_count
      - answer_time
      - token_time
      - tokens
      - avg_tps
      - tps
      properties:
        response:
          type: string
          description: The reply text. Redacted when you enable `redact_prompt`.
          examples:
          - Your ride is booked for 6pm.
        response_word_count:
          type: integer
          description: How many words the reply contained.
          examples:
          - 6
        answer_time:
          type: number
          description: How long the reply took to produce, in seconds.
          examples:
          - 1.42
        token_time:
          type: number
          description: 'How long the model spent generating, in seconds. For an [`ai`](/docs/swml/reference/calling/ai)

            agent this is the span from the first token to the last; for an

            [`amazon_bedrock`](/docs/swml/reference/calling/amazon-bedrock) agent it is `answer_time` less a

            fixed startup estimate, so treat it as approximate there.'
          examples:
          - 0.31
        tokens:
          type: integer
          description: How many tokens the reply used.
          examples:
          - 53
        avg_tps:
          type: number
          description: Average tokens per second across the reply.
          examples:
          - 37.3
        tps:
          type: number
          description: Tokens per second for this reply.
          examples:
          - 41.2
      unevaluatedProperties:
        not: {}
      description: Timing and token counts for one generated reply.
    Webhooks.AI.AiSwaigToolWebhookPayload:
      type: object
      required:
      - function
      - argument
      - argument_desc
      - description
      - call_id
      - ai_session_id
      - app_name
      - meta_data_token
      - meta_data
      - channel_active
      - channel_offhook
      - channel_ready
      - content_type
      - version
      - content_disposition
      - conversation_type
      properties:
        function:
          type: string
          description: The name of the function the AI is calling.
          examples:
          - get_weather
        argument:
          type: object
          properties:
            parsed:
              type: array
              items:
                type: object
                unevaluatedProperties: {}
              description: The arguments parsed into objects. Usually a single-element array.
              examples:
              - - city: San Francisco
            raw:
              type: string
              description: The raw argument string, exactly as the AI produced it.
              examples:
              - '{"city":"San Francisco"}'
            substituted:
              type: string
              description: 'Any text that surrounded the JSON, with the JSON itself removed. Omitted when the whole

                argument was JSON, which is the usual case.'
              examples:
              - ''
          required:
          - parsed
          - raw
          unevaluatedProperties:
            not: {}
          description: The arguments the AI passed to your function.
        argument_desc:
          type: object
          unevaluatedProperties: {}
          description: The function's parameter definition, as you declared it in `parameters`.
          examples:
          - type: object
            properties:
              city:
                type: string
                description: Name of the city
            required:
            - city
        description:
          type: string
          description: 'The description you gave the function in

            [`SWAIG.functions`](/docs/swml/reference/calling/ai/swaig/functions#properties).'
          examples:
          - Look up the current weather for a city.
        call_id:
          type: string
          description: The ID of the call. On a chat conversation this carries the conversation id instead.
          examples:
          - 2e1e66e5-5d07-413d-9668-55542992eec0
        ai_session_id:
          type: string
          description: The ID of the AI session on the call.
          examples:
          - a0d4e6e5-5d07-413d-9668-55542992eec0
        conversation_id:
          type: string
          description: 'The conversation ID, when the AI session has one. A text conversation held over the

            [AI chat endpoint](/docs/apis/rest/ai-chat/chat-methods) always has one, and it matches

            `call_id`.'
        app_name:
          type: string
          description: The name of your AI application.
          examples:
          - ai
        global_data:
          type: object
          unevaluatedProperties: {}
          description: The AI session's current `global_data`, when it has any.
          examples:
          - customer_tier: premium
            pickup_address: 123 Main St, Springfield
        meta_data_token:
          type: string
          description: 'The token that scopes `meta_data`. This is the `meta_data_token` you set on the function, or a

            value derived from the function''s `web_hook_url` and credentials when you did not set one.'
          examples:
          - my-token
        meta_data:
          type: object
          unevaluatedProperties: {}
          description: Metadata scoped to `meta_data_token`. An empty object when the function has none yet.
          examples:
          - order_number: '12345'
        caller_id_name:
          type: string
          description: The caller's name, when available.
          examples:
          - Jane Doe
        caller_id_num:
          type: string
          description: The caller's number, when available.
          examples:
          - '+15555550100'
        channel_active:
          type: boolean
          description: Whether the call is still up.
          examples:
          - true
        channel_offhook:
          type: boolean
          description: Whether the call is answered.
          examples:
          - true
        channel_ready:
          type: boolean
          description: Whether the AI session is ready to take actions.
          examples:
          - true
        content_type:
          type: string
          description: The content type of the request body. Always `text/swaig`.
          examples:
          - text/swaig
        version:
          type: string
          description: The SWAIG protocol version.
          examples:
          - '2.0'
        content_disposition:
          type: string
          description: How the body is delivered. Always `SWAIG Function`.
          examples:
          - SWAIG Function
        conversation_type:
          type: string
          enum:
          - voice
          - chat
          description: 'The kind of conversation the agent is running: a call, or a text conversation held over the

            [AI chat endpoint](/docs/apis/rest/ai-chat/chat-methods).'
          examples:
          - voice
        project_id:
          type: string
          description: Your project ID, when available.
          examples:
          - 4d0d6f16-5881-4fcc-92a4-02c51a91954d
        space_id:
          type: string
          description: Your Space ID, when available.
          examples:
          - 451ed9ff-e568-4222-8af9-4f9ab7428d09
        fatal_error:
          type: boolean
          description: '`true` when the AI session has hit an unrecoverable error. Included only in that case.'
        error_reason:
          type: string
          description: A description of the error. Included only when `fatal_error` is set.
        SWMLVars:
          type: object
          unevaluatedProperties: {}
          description: SWML variables for the call. Included when you enable `swaig_post_swml_vars`.
        SWMLCall:
          type: object
          unevaluatedProperties: {}
          description: SWML call state. Included when you enable `swaig_post_swml_vars`.
        call_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AICallLogEntry'
          description: The conversation so far, with sensitive values redacted. Included when you enable `swaig_post_conversation`.
        raw_call_log:
          type: array
          items:
            $ref: '#/components/schemas/Webhooks.AI.AICallLogEntry'
          description: The full, unredacted conversation so far. Included when you enable `swaig_post_conversation`.
      unevaluatedProperties:
        not: {}
    Webhooks.AI.SwaigSignatureRequestPayload:
      type: object
      required:
      - action
      - functions
      - content_type
      - content_disposition
      - version
      properties:
        action:
          type: string
          description: What the request is asking of you. Always `get_signature`.
          examples:
          - get_signature
        functions:
          type: array
          items:
            type: string
          description: 'The function names the `includes` entry asked for. This list can be empty, and it does not limit

            your reply: every definition you return is registered, whether or not it is named here.'
          examples:
          - - get_weather
        meta_data:
          type: object
          unevaluatedProperties: {}
          description: The `meta_data` you set on the `includes` entry. Omitted when you set none.
          examples:
          - store_id: sf-01
        meta_data_token:
          type: string
          description: 'The token scoping `meta_data`. Present on the check your endpoint can receive outside of a call,

            where it is a fixed value with nothing to interpret, and absent during a call.'
          examples:
          - my-token
        content_type:
          type: string
          description: The content type of the request body. Always `text/swaig`.
          examples:
          - text/swaig
        content_disposition:
          type: string
          description: How the body is delivered. Always `function signature request`.
          examples:
          - function signature request
        version:
          type: string
          description: The SWAIG protocol version.
          examples:
          - '2.0'
        project_id:
          type: string
          description: Your project ID, when available.
          examples:
          - 4d0d6f16-5881-4fcc-92a4-02c51a91954d
        space_id:
          type: string
          description: Your Space ID, when available.
          examples:
          - 451ed9ff-e568-4222-8af9-4f9ab7428d09
      unevaluatedProperties:
        not: {}
    Webhooks.AI.AIDebugWebhookFail:
      type: object
      required:
      - call_info
      - error
      - request_url
      - attempts
      - http_code
      properties:
        call_info:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AICallInfo'
          description: Identifies the call. The same values as the envelope's `call_info`.
        error:
          type: string
          description: Always `webhook error`.
          examples:
          - webhook error
        request_url:
          type: string
          description: The URL that was called.
          examples:
          - https://example.com/tools/get_weather
        attempts:
          type: integer
          description: How many attempts were made, including the first.
          examples:
          - 3
        request_payload:
          type: object
          unevaluatedProperties: {}
          description: The body that was sent, when there was one.
        parse_error:
          type: boolean
          description: Always `true` when present, meaning the response body was not valid JSON.
          examples:
          - true
        raw_response:
          type: string
          description: The response body as received. Included only when `parse_error` is set.
        parsed_response:
          type: object
          unevaluatedProperties: {}
          description: 'The response body parsed as JSON. Omitted when the body could not be parsed, where `parse_error`

            and `raw_response` carry the detail instead.'
        protocol_error:
          type: boolean
          description: Always `true` when present, meaning the request failed before a response was received.
          examples:
          - true
        curl_code:
          type: integer
          description: The transport error code. Included only when `protocol_error` is set.
          examples:
          - 28
        http_code:
          type: integer
          description: The HTTP status code. `0` when no response was received.
          examples:
          - 502
      unevaluatedProperties: {}
      description: 'Reports a tool webhook that could not be reached or did not answer usefully. Carries whatever

        detail the attempt produced, so unlisted keys can appear.'
  securitySchemes:
    SignalWireBasicAuth:
      type: http
      scheme: Basic
      description: 'SignalWire Basic Authentication using Project ID and API Token.


        The client sends HTTP requests with the Authorization header containing

        the word Basic followed by a space and a base64-encoded string of project_id:token.

        The project ID will be used as the username and the API token as the password.


        Example:

        ```

        Authorization: Basic base64(project_id:token)

        ```'
      x-fern-basic:
        username:
          name: project_id
          env: SIGNALWIRE_PROJECT_ID
        password:
          name: api_token
          env: SIGNALWIRE_API_TOKEN
    SignalWireBearerAuth:
      type: http
      scheme: Bearer
      description: 'SignalWire Bearer Token Authentication for subscriber endpoints.

        The client sends HTTP requests with the Authorization header containing

        the word Bearer followed by a space and the subscriber token.


        Example:

        ```

        Authorization: Bearer <subscriber_token>

        ```'
