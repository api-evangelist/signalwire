          required:
          - request_url
          - webhook_response
          unevaluatedProperties:
            not: {}
          description: A webhook request completed, with the request and response recorded.
        webhook_reply:
          anyOf:
          - type: object
            unevaluatedProperties: {}
          - type: 'null'
          description: 'The final reply the webhook produced, after matching. An array reply is wrapped as

            `{ "array": [...] }`. `null` when the webhook produced no reply.'
        webhook_fail:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AIDebugWebhookFail'
          description: 'A tool''s webhook could not be reached or did not answer usefully, after every retry. Sent

            whenever a tool call fails, so you can alert on tools breaking mid-call.'
        step_change:
          type: object
          properties:
            from_step:
              type: string
              description: The step it left. Omitted on the first step.
              examples:
              - greet
            from_index:
              type: integer
              description: The index of the step it left.
              examples:
              - 0
            to_step:
              type: string
              description: The step it moved to.
              examples:
              - collect_address
            to_index:
              type: integer
              description: The index of the step it moved to.
              examples:
              - 1
            trigger:
              type: string
              enum:
              - ai_function
              - webhook_action
              - gather_complete
              - auto_advance
              description: 'What caused the move. `ai_function` when the agent called `next_step`, `webhook_action` when a

                tool''s response asked for it, `gather_complete` when a gather finished, and `auto_advance` when

                the step''s own advance condition was met.'
              examples:
              - ai_function
          required:
          - from_index
          - to_step
          - to_index
          unevaluatedProperties:
            not: {}
          description: The agent moved to a different step.
        context_change:
          type: object
          properties:
            to_context:
              type: string
              description: The context it moved to.
              examples:
              - billing
            from_context:
              type: string
              description: The context it left. Omitted on the first context.
              examples:
              - default
            trigger:
              type: string
              enum:
              - ai_function
              - webhook_action
              description: 'What caused the move. `ai_function` when the agent called `change_context`, `webhook_action`

                when a tool''s response asked for it.'
              examples:
              - ai_function
            isolated:
              type: boolean
              description: Whether the new context starts without the previous conversation.
              examples:
              - false
          required:
          - to_context
          - isolated
          unevaluatedProperties:
            not: {}
          description: The agent moved to a different context.
        context_switch_data:
          type: object
          properties:
            data_root:
              type: object
              unevaluatedProperties: {}
              description: The variables available to the new context's prompt.
            info:
              type: object
              unevaluatedProperties: {}
              description: The context definition as you wrote it.
          required:
          - data_root
          - info
          unevaluatedProperties:
            not: {}
          description: The data a context switch was rendered against.
        gather_start:
          type: object
          properties:
            context:
              type: string
              description: The context the agent was in. `default` when you define no contexts.
              examples:
              - default
            step:
              type: string
              description: The step the agent was on. Included only when the context defines steps.
              examples:
              - collect_address
            step_index:
              type: integer
              description: The step's index. Included only when the context defines steps.
              examples:
              - 2
            output_key:
              type: string
              description: The key the collected answers are stored under. Omitted when none was set.
              examples:
              - address
            total_questions:
              type: integer
              description: How many questions the gather will ask.
              examples:
              - 3
          required:
          - context
          - total_questions
          unevaluatedProperties:
            not: {}
          description: A `gather` started collecting answers.
        gather_question:
          type: object
          properties:
            context:
              type: string
              description: The context the agent was in. `default` when you define no contexts.
              examples:
              - default
            step:
              type: string
              description: The step the agent was on. Included only when the context defines steps.
              examples:
              - collect_address
            step_index:
              type: integer
              description: The step's index. Included only when the context defines steps.
              examples:
              - 2
            key:
              type: string
              description: The key this question fills. Omitted when none was set.
              examples:
              - street
            question_index:
              type: integer
              description: The question's position in the gather, starting at 0.
              examples:
              - 0
            question_type:
              type: string
              description: The kind of answer expected. Omitted when unset.
              examples:
              - string
            requires_confirm:
              type: boolean
              description: Whether the answer has to be confirmed before the gather moves on.
              examples:
              - true
          required:
          - context
          - question_index
          - requires_confirm
          unevaluatedProperties:
            not: {}
          description: A `gather` asked a question.
        gather_answer:
          type: object
          properties:
            context:
              type: string
              description: The context the agent was in. `default` when you define no contexts.
              examples:
              - default
            step:
              type: string
              description: The step the agent was on. Included only when the context defines steps.
              examples:
              - collect_address
            step_index:
              type: integer
              description: The step's index. Included only when the context defines steps.
              examples:
              - 2
            key:
              type: string
              description: The key the answer filled. Omitted when none was set.
              examples:
              - street
            question_index:
              type: integer
              description: The question's position in the gather, starting at 0.
              examples:
              - 0
            attempt:
              type: integer
              description: Which attempt produced the answer, counting from 0.
              examples:
              - 0
            confirmed:
              type: boolean
              description: Whether the question required the caller to confirm the answer back before it was accepted.
              examples:
              - true
          required:
          - context
          - question_index
          - attempt
          - confirmed
          unevaluatedProperties:
            not: {}
          description: A `gather` accepted an answer.
        gather_reject:
          type: object
          properties:
            context:
              type: string
              description: The context the agent was in. `default` when you define no contexts.
              examples:
              - default
            step:
              type: string
              description: The step the agent was on. Included only when the context defines steps.
              examples:
              - collect_address
            step_index:
              type: integer
              description: The step's index. Included only when the context defines steps.
              examples:
              - 2
            key:
              type: string
              description: The key the answer would have filled. Omitted when none was set.
              examples:
              - street
            question_index:
              type: integer
              description: The question's position in the gather, starting at 0.
              examples:
              - 0
            attempt:
              type: integer
              description: Which attempt was rejected, counting from 0.
              examples:
              - 0
            reason:
              type: string
              enum:
              - missing_answer
              - confirmation_required
              description: 'Why it was rejected. `missing_answer` when no answer came back, `confirmation_required` when the

                answer arrived without the confirmation the question demands.'
              examples:
              - missing_answer
          required:
          - context
          - question_index
          - attempt
          unevaluatedProperties:
            not: {}
          description: A `gather` rejected an answer and will ask again.
        gather_complete:
          type: object
          properties:
            context:
              type: string
              description: The context the agent was in. `default` when you define no contexts.
              examples:
              - default
            step:
              type: string
              description: The step the agent was on. Included only when the context defines steps.
              examples:
              - collect_address
            step_index:
              type: integer
              description: The step's index. Included only when the context defines steps.
              examples:
              - 2
            output_key:
              type: string
              description: The key the collected answers were stored under. Omitted when none was set.
              examples:
              - address
            answered:
              type: integer
              description: How many questions were answered.
              examples:
              - 3
            completion_action:
              type: string
              description: What the gather did on completion. Omitted when nothing recorded it.
              examples:
              - next_step
          required:
          - context
          - answered
          unevaluatedProperties:
            not: {}
          description: A `gather` finished.
        conversation_add:
          allOf:
          - $ref: '#/components/schemas/Webhooks.AI.AIDebugConversationAdd'
          description: 'A message was added to the conversation, one per turn. Sent only at `debug_webhook_level` `2` and

            above. This is the same message that later appears in the post-prompt callback''s `call_log`.'
        llm_request:
          type: object
          properties:
            model:
              type: string
              description: The model being called.
              examples:
              - gpt-4.1-mini
            prompt_tokens:
              type: integer
              description: Tokens in the prompt.
              examples:
              - 412
            conversation_tokens:
              type: integer
              description: Tokens in the conversation so far.
              examples:
              - 5215
          required:
          - model
          - prompt_tokens
          - conversation_tokens
          unevaluatedProperties:
            not: {}
          description: The agent is about to call the model. Sent only at `debug_webhook_level` `2` and above.
        llm_response:
          type: object
          properties:
            model:
              type: string
              description: The model that was called.
              examples:
              - gpt-4.1-mini
            output_tokens:
              type: integer
              description: Tokens in the answer.
              examples:
              - 53
            duration_ms:
              type: integer
              description: How long the call took, in milliseconds.
              examples:
              - 836
            success:
              type: boolean
              description: Whether the model returned anything.
              examples:
              - true
            error:
              type: string
              description: A description of the failure. Included only when the call failed.
          required:
          - model
          - output_tokens
          - duration_ms
          - success
          unevaluatedProperties:
            not: {}
          description: The model answered. Sent only at `debug_webhook_level` `2` and above.
        llm_error:
          type: object
          properties:
            event:
              type: string
              enum:
              - token_exhaustion
              - llm_fatal
              - llm_max_retries
              - reasoning_only_retry
              - empty_response_nudge_retry
              - empty_response_effort_bump_retry
              - llm_retry
              description: Which failure this is.
              examples:
              - llm_retry
            model:
              type: string
              description: The model that was called. Omitted on `token_exhaustion`.
              examples:
              - gpt-4.1-mini
            token_count:
              type: integer
              description: Tokens in the conversation. Included only on `token_exhaustion`.
              examples:
              - 128000
            limit:
              type: integer
              description: The token ceiling that was hit. Included only on `token_exhaustion`.
              examples:
              - 120000
            errors:
              type: integer
              description: How many failures have accumulated. Included only on `llm_max_retries`.
              examples:
              - 4
            reasoning_effort:
              type: string
              description: The effort level being retried at. Included only on `empty_response_effort_bump_retry`.
              examples:
              - high
          required:
          - event
          unevaluatedProperties:
            not: {}
          description: 'A model call failed or had to be retried. Read `event` for which: `token_exhaustion` and

            `llm_fatal` end the session, `llm_max_retries` gives up after repeated failures, and

            `llm_retry`, `reasoning_only_retry`, `empty_response_nudge_retry`, and

            `empty_response_effort_bump_retry` recover silently.'
        consolidation:
          type: object
          properties:
            event:
              type: string
              description: Always `consolidation`.
              examples:
              - consolidation
            token_count:
              type: integer
              description: Tokens in the conversation when it tripped.
              examples:
              - 121400
            limit:
              type: integer
              description: The ceiling that was hit.
              examples:
              - 120000
          required:
          - event
          - token_count
          - limit
          unevaluatedProperties:
            not: {}
          description: The conversation passed its token ceiling and was summarized to make room.
        summarize_start:
          type: object
          properties:
            mode:
              type: string
              description: How the summary is being produced.
              examples:
              - function
            model:
              type: string
              description: The model producing it. `default` when none was configured.
              examples:
              - gpt-4.1-mini
          required:
          - mode
          - model
          unevaluatedProperties:
            not: {}
          description: The post-prompt summary is about to be generated.
        post_prompt:
          type: object
          properties:
            url:
              type: string
              description: The URL the report was sent to.
              examples:
              - https://example.com/reports
          required:
          - url
          unevaluatedProperties:
            not: {}
          description: The post-prompt report was delivered.
        text_normalize:
          type: object
          properties:
            direction:
              type: string
              enum:
              - tn
              - itn
              description: '`tn` rewrites text for speaking, `itn` rewrites recognized speech for reading.'
              examples:
              - itn
            language:
              type: string
              description: The language the rewrite ran in.
              examples:
              - en
            original:
              type: string
              description: The text before the rewrite.
              examples:
              - twenty twenty six
            normalized:
              type: string
              description: The text after it.
              examples:
              - '2026'
          required:
          - direction
          - language
          - original
          - normalized
          unevaluatedProperties:
            not: {}
          description: Text was rewritten between spoken and written form, for recognition or speech.
        voice_error:
          type: object
          properties:
            event:
              type: string
              enum:
              - voice_config_error
              - voice_runtime_error
              description: '`voice_config_error` when the voice was invalid, `voice_runtime_error` when it failed mid-call.'
              examples:
              - voice_config_error
            engine:
              type: string
              description: The engine that failed.
              examples:
              - elevenlabs
            voice:
              type: string
              description: The voice that failed.
              examples:
              - rachel
            fallback_engine:
              type: string
              description: The engine used instead.
              examples:
              - gcloud
            fallback_voice:
              type: string
              description: The voice used instead.
              examples:
              - en-US-Neural2-J
          required:
          - event
          - engine
          - voice
          - fallback_engine
          - fallback_voice
          unevaluatedProperties:
            not: {}
          description: The configured voice could not be used and the agent fell back to another.
        warning:
          type: object
          properties:
            event:
              type: string
              description: Which warning this is.
              examples:
              - excessive_prompt_tokens
            tokens:
              type: integer
              description: Tokens in the prompt that triggered it.
              examples:
              - 82000
          required:
          - event
          - tokens
          unevaluatedProperties:
            not: {}
          description: Something about the configuration is likely to cause trouble.
        oart_user_transcript:
          type: object
          properties:
            text:
              type: string
              description: The transcribed text.
              examples:
              - I need a ride to the airport.
          required:
          - text
          unevaluatedProperties:
            not: {}
          description: The caller's speech was transcribed. Speech-to-speech sessions only.
        oart_assistant_transcript:
          type: object
          properties:
            text:
              type: string
              description: The transcribed text.
              examples:
              - Your ride is booked for 6pm.
          required:
          - text
          unevaluatedProperties:
            not: {}
          description: The agent's speech was transcribed. Speech-to-speech sessions only.
        oart_response_done:
          type: object
          properties:
            latency:
              type: integer
              description: Time from the end of the caller's turn to the start of the reply, in milliseconds.
              examples:
              - 836
            utterance_latency:
              type: integer
              description: Time to the first word of the reply, in milliseconds.
              examples:
              - 934
            audio_latency:
              type: integer
              description: Time to the first audio of the reply, in milliseconds.
              examples:
              - 1106
            acoustic_latency:
              type: integer
              description: Time to the first sound leaving the platform, in milliseconds.
              examples:
              - 1180
            status:
              type: string
              description: How the reply finished. Omitted when nothing recorded it.
              examples:
              - completed
          required:
          - latency
          - utterance_latency
          - audio_latency
          - acoustic_latency
          unevaluatedProperties:
            not: {}
          description: The agent finished a reply, with its timings. Speech-to-speech sessions only.
        inner_dialog:
          type: object
          properties:
            text:
              type: string
              description: The reasoning text. The caller never hears this.
              examples:
              - The caller has not given a pickup address yet.
          required:
          - text
          unevaluatedProperties:
            not: {}
          description: 'The agent''s private reasoning, when you enable `enable_inner_dialog`.

            Speech-to-speech sessions only.'
      unevaluatedProperties: {}
    Webhooks.AI.AISidecarSwaigToolWebhookPayload:
      type: object
      required:
      - function
      - argument
      - channel_data
      properties:
        function:
          type: string
          description: The name of the function the model is calling.
          examples:
          - lookup_competitor
        argument:
          type: object
          properties:
            parsed:
              type: array
              items:
                type: object
