      required: true
      description: Unique ID of the phone number.
      schema:
        $ref: '#/components/schemas/uuid'
    ListPhoneNumbersQuery.page_size:
      name: page_size
      in: query
      required: false
      description: The number of items per page (1-1000).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 50
      explode: false
    ListPhoneNumbersQuery.filter_number:
      name: filter_number
      in: query
      required: false
      description: The phone number in E164 format. Will return all Phone Numbers containing this value as a substring.
      schema:
        type: string
      explode: false
    ListPhoneNumbersQuery.page_token:
      name: page_token
      in: query
      required: false
      description: Token for cursor-based pagination. Required when page_number > 0.
      schema:
        type: string
      explode: false
    ListPhoneNumbersQuery.page_number:
      name: page_number
      in: query
      required: false
      description: The page number to retrieve (0-indexed).
      schema:
        type: integer
        format: int32
        default: 0
      explode: false
  securitySchemes:
    SignalWireBasicAuth:
      type: http
      scheme: Basic
      description: 'SignalWire Basic Authentication using Project ID and API Token.


        The client sends HTTP requests with the Authorization header containing

        the word Basic followed by a space and a base64-encoded string of project_id:token.

        The project ID will be used as the username and the API token as the password.


        Example:

        ```

        Authorization: Basic base64(project_id:token)

        ```'
      x-fern-basic:
        username:
          name: project_id
          env: SIGNALWIRE_PROJECT_ID
        password:
          name: api_token
          env: SIGNALWIRE_API_TOKEN
    SignalWireBearerAuth:
      type: http
      scheme: Bearer
      description: 'SignalWire Bearer Token Authentication for subscriber endpoints.

        The client sends HTTP requests with the Authorization header containing

        the word Bearer followed by a space and the subscriber token.


        Example:

        ```

        Authorization: Bearer <subscriber_token>

        ```'
