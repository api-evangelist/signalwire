openapi: 3.2.0
info:
  title: SignalWire REST cXML Applications API
  version: 1.0.0
  contact:
    name: SignalWire
    url: https://support.signalwire.com/portal/en/newticket?departmentId=1029313000000006907&layoutId=1029313000000074011
    email: support@signalwire.com
  license:
    name: MIT
    url: https://github.com/signalwire/docs/blob/main/LICENSE
  termsOfService: https://signalwire.com/legal/signalwire-cloud-agreement
  description: Endpoints related to creating & managing cXML Applications
servers:
- url: https://{space_name}.signalwire.com
  description: SignalWire API
  variables:
    space_name:
      default: '{Your_Space_Name}'
      description: Your SignalWire Space name
security:
- SignalWireBasicAuth: []
tags:
- name: cXML Applications
  description: Endpoints related to creating & managing cXML Applications
  externalDocs:
    url: https://signalwire.com/docs/apis
    description: Developer documentation on cXML Application, Fabric API endpoints
paths:
  /api/fabric/resources/cxml_applications:
    get:
      operationId: list_cxml_applications
      summary: List cXML applications
      description: 'A list of cXML Applications


        #### Permissions


        The API token used to authenticate must have the following scope(s) enabled to make a successful request: _Voice_, _Messaging_, _Fax_, or _Video_.


        [Learn more about API scopes](/docs/platform/your-signalwire-api-space).'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CxmlApplicationListResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode401'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode404'
        '500':
          description: An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode500'
      tags:
      - cXML Applications
  /api/fabric/resources/cxml_applications/{id}:
    get:
      operationId: get_cxml_application
      summary: Get cXML application
      description: 'Returns a cXML Application by ID


        #### Permissions


        The API token used to authenticate must have the following scope(s) enabled to make a successful request: _Voice_, _Messaging_, _Fax_, or _Video_.


        [Learn more about API scopes](/docs/platform/your-signalwire-api-space).'
      parameters:
      - $ref: '#/components/parameters/CxmlApplicationPathID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CxmlApplicationResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode401'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode404'
        '500':
          description: An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode500'
      tags:
      - cXML Applications
    put:
      operationId: update_cxml_application
      summary: Update cXML application
      description: 'Updates a cXML Application by ID


        #### Permissions


        The API token used to authenticate must have the following scope(s) enabled to make a successful request: _Voice_, _Messaging_, _Fax_, or _Video_.


        [Learn more about API scopes](/docs/platform/your-signalwire-api-space).'
      parameters:
      - $ref: '#/components/parameters/CxmlApplicationPathID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CxmlApplicationResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode401'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode404'
        '422':
          description: The request contains invalid parameters. See errors for details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CxmlApplicationUpdateStatusCode422'
        '500':
          description: An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode500'
      tags:
      - cXML Applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CxmlApplicationUpdateRequest'
    delete:
      operationId: delete_cxml_application
      summary: Delete cXML application
      description: 'Deletes a LAML Application by ID


        #### Permissions


        The API token used to authenticate must have the following scope(s) enabled to make a successful request: _Voice_, _Messaging_, _Fax_, or _Video_.


        [Learn more about API scopes](/docs/platform/your-signalwire-api-space).'
      parameters:
      - $ref: '#/components/parameters/CxmlApplicationPathID'
      responses:
        '204':
          description: 'There is no content to send for this request, but the headers may be useful. '
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode401'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode404'
        '500':
          description: An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode500'
      tags:
      - cXML Applications
  /api/fabric/resources/cxml_applications/{id}/addresses:
    get:
      operationId: list_cxml_application_addresses
      summary: List cXML application Addresses
      description: 'This endpoint returns a list of addresses associated with a specific LaML Application.


        #### Permissions


        The API token used to authenticate must have the following scope(s) enabled to make a successful request: _Voice_, _Messaging_, _Fax_, or _Video_.


        [Learn more about API scopes](/docs/platform/your-signalwire-api-space).'
      parameters:
      - $ref: '#/components/parameters/CxmlApplicationAddressPathID'
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CxmlApplicationAddressListResponse'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode401'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode404'
        '500':
          description: An internal server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Types.StatusCodes.StatusCode500'
      tags:
      - cXML Applications
components:
  schemas:
    CxmlApplicationPaginationResponse:
      type: object
      required:
      - self
      - first
      properties:
        self:
          type: string
          format: uri
          description: Linmk to the current page
          examples:
          - https://example.signalwire.com/api/fabric/resources/cxml_applications?page_number=0&page_size=50&type=cxml_application
        first:
          type: string
          format: uri
          description: Link to the first page
          examples:
          - https://example.signalwire.com/api/fabric/resources/cxml_applications?page_size=50&type=cxml_application
        next:
          type: string
          format: uri
          description: Link to the next page
          examples:
          - https://example.signalwire.com/api/fabric/resources/cxml_applications?page_number=1&page_size=50&page_token=PAbff61159-faab-48b3-959a-3021a8f5beca&type=cxml_application
        prev:
          type: string
          format: uri
          description: Link to the previous page
          examples:
          - https://example.signalwire.com/api/fabric/resources/cxml_applications?page_number=0&page_size=50&page_token=PAbff61159-faab-48b3-959a-3021a8f5beca&type=cxml_application
      unevaluatedProperties:
        not: {}
    CxmlApplicationUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
          description: Display name of the cXML Application
          examples:
          - Reception App
        account_sid:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Project ID for the cXML Application
          examples:
          - 1313fe58-5e14-4c11-bbe7-6fdfa11fe780
        voice_url:
          type: string
          description: URL to handle incoming calls
          examples:
          - https://example.com/voice/incoming
        voice_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for voice URL
          examples:
          - POST
        voice_fallback_url:
          type: string
          description: Fallback URL for voice errors
          examples:
          - https://example.com/voice/fallback
        voice_fallback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for voice fallback URL
          examples:
          - POST
        status_callback:
          type: string
          description: URL to receive status callbacks
          examples:
          - https://example.com/voice/status
        status_callback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for status callbacks
          examples:
          - POST
        sms_url:
          type: string
          description: URL to handle incoming messages
          examples:
          - https://example.com/message/incoming
        sms_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for SMS URL
          examples:
          - POST
        sms_fallback_url:
          type: string
          description: Fallback URL for SMS errors
          examples:
          - https://example.com/message/fallback
        sms_fallback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for SMS fallback URL
          examples:
          - POST
        sms_status_callback:
          type: string
          description: URL to receive SMS status callbacks
          examples:
          - https://example.com/message/status
        sms_status_callback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for SMS status callbacks
          examples:
          - POST
      unevaluatedProperties:
        not: {}
    CxmlApplicationAddressListResponse:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FabricAddress'
          description: An array of objects that contain a list of Cxml Application Addresses
        links:
          allOf:
          - $ref: '#/components/schemas/CxmlApplicationAddressPaginationResponse'
          description: Object containing pagination links
      unevaluatedProperties:
        not: {}
    Types.StatusCodes.StatusCode401:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - Unauthorized
      unevaluatedProperties:
        not: {}
      description: Access is unauthorized.
    AddressChannel:
      anyOf:
      - $ref: '#/components/schemas/AudioChannel'
      - $ref: '#/components/schemas/MessagingChannel'
      - $ref: '#/components/schemas/VideoChannel'
    VideoChannel:
      type: object
      required:
      - video
      properties:
        video:
          type: string
          description: Video Channel of Fabric Address
          examples:
          - /external/resource_name?channel=video
      unevaluatedProperties:
        not: {}
    RequestUrlMethodType:
      type: string
      enum:
      - GET
      - POST
      description: The method type to use for the URL
    CxmlApplicationUpdateStatusCode422:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Types.StatusCodes.RestApiErrorItem'
          description: List of validation errors.
      unevaluatedProperties:
        not: {}
      description: The request contains invalid parameters. See errors for details.
      examples:
      - statusCode: 422
        errors:
        - type: validation_error
          code: invalid_parameter_value
          message: voice_url must be a valid URL
          attribute: voice_url
          url: https://signalwire.com/docs/apis/error-codes
    FabricAddress:
      type: object
      required:
      - id
      - name
      - display_name
      - cover_url
      - preview_url
      - locked
      - channels
      - created_at
      - type
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Unique ID of the Fabric Address.
          examples:
          - 691af061-cd86-4893-a605-173f47afc4c2
        name:
          type: string
          description: Name of the Fabric Address.
          examples:
          - justice-league
        display_name:
          type: string
          description: Display name of the Fabric Address.
          examples:
          - Justice League
        cover_url:
          type: string
          description: Cover url of the Fabric Address.
          examples:
          - https://coverurl.com
        preview_url:
          type: string
          description: Preview url of the Fabric Address.
          examples:
          - https://previewurl.com
        locked:
          type: boolean
          description: Locks the Fabric Address. This is used to prevent the Fabric Address from accepting calls.
          examples:
          - true
        channels:
          allOf:
          - $ref: '#/components/schemas/AddressChannel'
          description: Channels of the Fabric Address.
        created_at:
          type: string
          format: date-time
          description: Fabric Address Creation Date.
          examples:
          - '2024-05-06T12:20:00Z'
        type:
          $ref: '#/components/schemas/DisplayTypes'
      unevaluatedProperties:
        not: {}
    AudioChannel:
      type: object
      required:
      - audio
      properties:
        audio:
          type: string
          description: Audio Channel of Fabric Address
          examples:
          - /external/resource_name?channel=audio
      unevaluatedProperties:
        not: {}
    uuid:
      type: string
      format: uuid
      description: Universal Unique Identifier.
    Types.StatusCodes.StatusCode404:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - Not Found
      unevaluatedProperties:
        not: {}
      description: The server cannot find the requested resource.
    CxmlApplicationListResponse:
      type: object
      required:
      - data
      - links
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CxmlApplicationResponse'
          description: An array of objects containing the list of cXML Application(s) data.
        links:
          allOf:
          - $ref: '#/components/schemas/CxmlApplicationPaginationResponse'
          description: Object containing pagination links
      unevaluatedProperties:
        not: {}
    Types.StatusCodes.StatusCode500:
      type: object
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - Internal Server Error
      unevaluatedProperties:
        not: {}
      description: An internal server error occurred.
    CxmlApplication:
      type: object
      required:
      - id
      - project_id
      - friendly_name
      - voice_url
      - voice_method
      - voice_fallback_url
      - voice_fallback_method
      - status_callback
      - status_callback_method
      - sms_url
      - sms_method
      - sms_fallback_url
      - sms_fallback_method
      - sms_status_callback
      - sms_status_callback_method
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Unique ID of the cXML Application.
          examples:
          - 1313fe58-5e14-4c11-bbe7-6fdfa11fe780
        project_id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Project ID for the cXML Application
          examples:
          - 1313fe58-5e14-4c11-bbe7-6fdfa11fe780
        friendly_name:
          type: string
          description: Display name of the cXML Application
          examples:
          - Reception App
        voice_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to handle incoming calls
          examples:
          - https://example.com/voice/incoming
        voice_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for voice URL
          examples:
          - GET
        voice_fallback_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Fallback URL for voice errors
          examples:
          - https://example.com/voice/fallback
        voice_fallback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for voice fallback URL
          examples:
          - GET
        status_callback:
          anyOf:
          - type: string
            format: uri
          - type: 'null'
          description: URL to receive status callbacks
          examples:
          - https://example.com/voice/status
        status_callback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for status callbacks
          examples:
          - GET
        sms_url:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to handle incoming messages
          examples:
          - https://example.com/message/incoming
        sms_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for SMS URL
          examples:
          - GET
        sms_fallback_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Fallback URL for SMS errors
          examples:
          - https://example.com/message/fallback
        sms_fallback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for SMS fallback URL
          examples:
          - GET
        sms_status_callback:
          anyOf:
          - type: string
          - type: 'null'
          description: URL to receive SMS status callbacks
          examples:
          - https://example.com/message/status
        sms_status_callback_method:
          allOf:
          - $ref: '#/components/schemas/RequestUrlMethodType'
          description: HTTP method for SMS status callbacks
          examples:
          - GET
      unevaluatedProperties:
        not: {}
    MessagingChannel:
      type: object
      required:
      - messaging
      properties:
        messaging:
          type: string
          description: Messaging Channel of Fabric Address
          examples:
          - /external/resource_name?channel=messaging
      unevaluatedProperties:
        not: {}
    Types.StatusCodes.RestApiErrorItem:
      type: object
      required:
      - type
      - code
      - message
      - url
      properties:
        type:
          type: string
          description: The category of error.
          examples:
          - validation_error
        code:
          type: string
          description: A specific error code.
          examples:
          - invalid_parameter
        message:
          type: string
          description: A description of what caused the error.
          examples:
          - Name must be present
        attribute:
          anyOf:
          - type: string
          - type: 'null'
          description: The request parameter that caused the error, if applicable.
          examples:
          - name
        url:
          type: string
          description: A link to documentation about this error.
          examples:
          - https://signalwire.com/docs/apis/error-codes
      unevaluatedProperties:
        not: {}
      description: Details about a specific error.
    CxmlApplicationResponse:
      type: object
      required:
      - id
      - project_id
      - display_name
      - type
      - created_at
      - updated_at
      - cxml_application
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Unique ID of the cXML Application.
          examples:
          - 993ed018-9e79-4e50-b97b-984bd5534095
        project_id:
          allOf:
          - $ref: '#/components/schemas/uuid'
          description: Unique ID of the Project.
          examples:
          - 1313fe58-5e14-4c11-bbe7-6fdfa11fe780
        display_name:
          type: string
          description: Display name of the cXML Application Fabric Resource
          examples:
          - Reception App
        type:
          type: string
          enum:
          - cxml_application
          description: Type of the Fabric Resource
          examples:
          - cxml_application
        created_at:
          type: string
          format: date-time
          description: Date and time when the resource was created.
          examples:
          - '2024-05-06T12:20:00Z'
        updated_at:
          type: string
          format: date-time
          description: Date and time when the resource was updated.
          examples:
          - '2024-05-06T12:20:00Z'
        cxml_application:
          allOf:
          - $ref: '#/components/schemas/CxmlApplication'
          description: cXML Application data.
      unevaluatedProperties:
        not: {}
    DisplayTypes:
      type: string
      enum:
      - app
      - room
      - call
      - subscriber
      description: DisplayTypes
    CxmlApplicationAddressPaginationResponse:
      type: object
      required:
      - self
      - first
      properties:
        self:
          type: string
          description: Self link for the current page
          examples:
          - https://example.signalwire.com/api/fabric/resources/laml_applications/a87db7ed-8ebe-42e4-829f-8ba5a4152f54/addresses?page_number=0&page_size=50&type=cxml_application
        first:
          type: string
          description: Link to the first page of results
          examples:
          - https://example.signalwire.com/api/fabric/resources/laml_applications/a87db7ed-8ebe-42e4-829f-8ba5a4152f54/addresses?page_number=0&page_size=50&type=cxml_application
        next:
          type: string
          description: Link to the next page of results
          examples:
          - https://example.signalwire.com/api/fabric/resources/laml_applications/a87db7ed-8ebe-42e4-829f-8ba5a4152f54/addresses?page_number=1&page_size=50&page_token=PAbff61159-faab-48b3-959a-3021a8f5beca&type=cxml_application
        prev:
          type: string
          description: Link to the previous page of results
          examples:
          - https://example.signalwire.com/api/fabric/resources/laml_applications/a87db7ed-8ebe-42e4-829f-8ba5a4152f54/addresses?page_number=0&page_size=50&page_token=PAbff61159-faab-48b3-959a-3021a8f5beca&type=cxml_application
      unevaluatedProperties:
        not: {}
  parameters:
    CxmlApplicationAddressPathID:
      name: id
      in: path
      required: true
      description: The unique identifier of the cXML Application.
      schema:
        $ref: '#/components/schemas/uuid'
    CxmlApplicationPathID:
      name: id
      in: path
      required: true
      description: Unique ID of a cXML Application.
      schema:
        $ref: '#/components/schemas/uuid'
  securitySchemes:
    SignalWireBasicAuth:
      type: http
      scheme: Basic
      description: 'SignalWire Basic Authentication using Project ID and API Token.


        The client sends HTTP requests with the Authorization header containing

        the word Basic followed by a space and a base64-encoded string of project_id:token.

        The project ID will be used as the username and the API token as the password.


        Example:

        ```

        Authorization: Basic base64(project_id:token)

        ```'
      x-fern-basic:
        username:
          name: project_id
          env: SIGNALWIRE_PROJECT_ID
        password:
          name: api_token
          env: SIGNALWIRE_API_TOKEN
    SignalWireBearerAuth:
      type: http
      scheme: Bearer
      description: 'SignalWire Bearer Token Authentication for subscriber endpoints.

        The client sends HTTP requests with the Authorization header containing

        the word Bearer followed by a space and the subscriber token.


        Example:

        ```

        Authorization: Bearer <subscriber_token>

        ```'
