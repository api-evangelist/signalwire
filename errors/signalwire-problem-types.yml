  description: Too many call requests without verifying this number.
- code: too_many_verification_requests_in_time_frame
  description: This account has had too many Verified Caller ID requests within a short timeframe. As
    a precaution, we have disabled creating more for a short time. Please contact support if you need
    this restriction lifted sooner.
- code: unable_to_deliver_to_carrier
  description: The message could not be handed off to the carrier. This is typically a temporary issue
    — retry with backoff, and contact Support if it persists.
- code: unknown_destination_handset
  description: The message could not be routed to the destination handset because the number is unknown
    or unreachable. Verify the destination number and its format.
- code: unknown_download_error
  description: An unexpected error occurred while downloading the file. Please try again later or contact
    support if the issue persists.
- code: unknown_error
  description: The delivery failed at the carrier level for an unspecified reason. Retry, and contact
    Support if the issue persists.
- code: unreachable_destination_handset
  description: The destination handset could not be reached — it may be busy, offline, not SMS-capable,
    or have full storage. This is often temporary, so retry later.
- code: unrecognized_fabric_addresses
  description: One or more of the provided fabric addresses is unrecognized. Check that all IDs are valid
    and belong to the current project.
- code: unrouteable_message
  description: The outbound message could not be routed to a destination. Verify the destination number
    and your project's [geographic permissions](/docs/platform/how-to-enable-international-services).
- code: unrouteable_message_received
  description: An inbound message could not be routed to a destination in your project. Verify that the
    receiving number is configured with a handler for inbound messages.
- code: unsupported_file_extension
  description: Unsupported file extension.
- code: unsupported_media_type
  description: The media content type `%{content_type}` is not supported. Use a supported media format
    and retry.
- code: unsupported_mode
  description: This mode is not supported on this number.
- code: unsupported_option
  description: The specified option is not supported.
- code: unsupported_region
  description: This number must be from an allowed region.
- code: uri_does_not_resolve_to_address
  description: The provided URI does not resolve to a recognized address.
- code: uri_does_not_resolve_to_resource
  description: The provided URI does not resolve to a valid resource.
- code: uri_resolves_to_unsupported_resource
  description: The provided URI resolves to a resource that is unsupported for dialing.
- code: upload_error
  description: There was an error while uploading the file. Please try again.
- code: url_failed_to_parse
  description: An unknown error occurred when parsing the provided URL.
- code: url_is_unsafe
  description: URL must not point to internal/private networks.
- code: value_not_unique
  description: This value **must** be unique.
- code: verification_request_too_soon
  description: This number has received a verification call too recently. Please wait a minute before
    requesting another call.
- code: verified_caller_id_not_permitted
  description: Verified caller IDs are not permitted for outbound messaging.
- code: '-32001'
  description: No conversation with that id exists in your project.
- code: '-32002'
  description: Your `config_url` could not be fetched. Check that it's reachable from the public internet
    — not `localhost`, not a private address.
- code: '-32003'
  description: The model provider failed.
- code: '-32004'
  description: Storage failure.
- code: '-32005'
  description: Too many `summarize` calls on this conversation, which allows one per minute.
- code: '-32006'
  description: The chat rate limit was exceeded.
- code: '-32007'
  description: Another chat operation is already in progress for this conversation.
- code: '-32600'
  description: The JSON-RPC envelope was malformed.
- code: '-32601'
  description: No method by that name.
- code: '-32602'
  description: A required param is missing, or one carries an invalid value.
- code: '-32603'
  description: An unexpected failure.
