format: vendor-json
rfc9457: false
note: SignalWire does not use RFC 9457 application/problem+json. Both contracts return application/json
  with a vendor error envelope. The /api/* surface returns {"errors":[{type,code,message,attribute,url}]}
  and may carry several entries when multiple fields fail validation at once; the /api/relay/rest surface
  returns {"errors":[{detail,status,title,code}]}. The `code` field in both maps to the same published
  reference. Error code names and meanings below are transcribed verbatim from the provider's own error-code
  reference page; HTTP status coverage is derived from the two OpenAPI contracts.
envelopes:
- surface: /api/* (messaging, calling, fabric, and others)
  media_type: application/json
  shape: '{"errors": [{"type": "...", "code": "...", "message": "...", "attribute": "...", "url": "..."}]}'
  fields:
    type: The category of the error (e.g. validation_error).
    code: A specific, machine-readable code — matches the published error-code reference.
    message: A human-readable description of what went wrong.
    attribute: The request parameter that triggered the error, when applicable.
    url: A link back to the error-code documentation.
  multi_error: true
  docs: https://signalwire.com/docs/apis/error-codes
- surface: /api/relay/rest
  media_type: application/json
  shape: '{"errors": [{"detail": "...", "status": ..., "title": "...", "code": "..."}]}'
  fields:
    detail: Human-readable detail.
    status: HTTP status.
    title: Short title.
    code: Machine-readable code, same reference as above.
  multi_error: true
  docs: https://signalwire.com/docs/apis/error-codes
- surface: Compatibility API (/api/laml/2010-04-01)
  media_type: application/json
  shape: Twilio-compatible error body carrying a numeric code (4xxx / 1xxxx / 3xxxx / 6xxxx classes).
  multi_error: false
  docs: https://signalwire.com/docs/compatibility-api/rest/error-codes
