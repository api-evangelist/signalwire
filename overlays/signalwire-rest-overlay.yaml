  description: Record the runtime facts an agent needs that the contract does not state.
  update:
    x-agent-notes:
      tenancy: >-
        servers[] is templated on {space_name}. Every request goes to the customer's own Space
        subdomain; there is no shared production host. An agent must be given the Space subdomain
        before any call is possible.
      https_only: Plain HTTP requests are refused with no automatic upgrade.
      idempotency: >-
        Not supported. No Idempotency-Key header is declared on any operation. Retrying a POST that
        places a call or sends a message can duplicate it.
      pagination: Link-based — follow links.next rather than constructing page URLs.
      error_envelope: '{"errors":[{type,code,message,attribute,url}]} on /api/*; {"errors":[{detail,status,title,code}]} on /api/relay/rest. May carry multiple entries.'
      rate_limit_on_exhaustion: HTTP 429; back off and retry.
      test_mode: >-
        None published. There is no test credential prefix and no magic test number range; calls and
        messages placed with a live token are real and billed.
- target: $.info
  description: Record the reversibility posture derived from the contract itself.
  update:
    x-reversibility:
      grade: verified
      cancel_call: >-
        Update the call with Status=canceled before it connects, or Status=completed to hang up an
        in-progress call.
      cancel_fax: >-
        Update the fax with Status=canceled; the fax must still be in queued status.
      redact_message: Terminal-state messages only; irreversible once redacted.
      deletes: 37 DELETE/redact operations, no restore path and no retention window published.
