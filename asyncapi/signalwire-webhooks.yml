asyncapi_note: 'SignalWire publishes NO AsyncAPI document. Its event surface is declared instead inside
  the two OpenAPI 3.1 contracts as first-class `webhooks:` objects — 14 in the REST API and 5 in the Compatibility
  API, each with a full request body schema. That is a real, machine-readable event contract; it is simply
  expressed in OpenAPI 3.1 rather than AsyncAPI. Nothing is fabricated here: every row below is transcribed
  from a webhook the provider declares in its own spec. The docs repo also carries a typespec-webhook
  emitter (specs/emitters/typespec-webhook), which is how these are generated.'
delivery:
  style: HTTP callback to a customer-supplied URL
  configuration: A phone number is pointed at a Resource (SWML Script, cXML Application, Relay Application,
    AI Agent, Call Flow) that holds the webhook URL.
  response_contract: The handler replies 200 OK with SWML (or cXML on the Compatibility API) telling SignalWire
    how to handle the call or message.
  signature_validation: validate_webhook_signature / validate_request helpers ship in the Server SDKs;
    SWAIG tool webhooks carry a signature request flow.
  docs: https://signalwire.com/docs/platform/webhooks
  security_docs: https://signalwire.com/docs/swml/guides/webhook-security
