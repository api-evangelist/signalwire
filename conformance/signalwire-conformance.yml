    with protocolVersion 2025-06-18 (serverInfo fern-docs-mcp-server 1.0.0) and tools/list with one
    tool on 2026-08-27. Scope is documentation search only — see mcp/signalwire-mcp.yml.
- id: http-basic
  name: HTTP Basic Authentication (RFC 7617)
  conforms: true
  evidence: SignalWireBasicAuth securityScheme (type http, scheme Basic) applied as the default
