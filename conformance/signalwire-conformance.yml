    live call control.
- id: json-schema-2020-12
  name: JSON Schema 2020-12
  conforms: true
  evidence: json-schema/signalwire-swml.json is a 512KB TypeSpec-emitted JSON Schema for the SWML
    document object, published in github.com/signalwire/docs under specs/swml/.
- id: mcp
  name: Model Context Protocol
  conforms: true
