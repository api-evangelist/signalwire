    summaries, securitySchemes and 4xx/5xx responses.
- id: openapi-3.1-webhooks
  name: OpenAPI 3.1 webhooks object
  conforms: true
  evidence: 19 first-class `webhooks:` entries across the two contracts (14 REST, 5 Compatibility),
