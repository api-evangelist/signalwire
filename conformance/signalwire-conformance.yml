domain_standards:
- id: stir-shaken
  name: STIR/SHAKEN (RFC 8224 / 8588 — telephone identity attestation)
  conforms: true
  evidence: >-
    SignalWire maintains libstirshaken, a C library implementing STIR/SHAKEN STI-SP AS/VS and
    STI-CA (https://github.com/signalwire/libstirshaken), and kamailio-shaken. Attestation is a
    carrier-layer obligation for US voice originators rather than a REST contract shape, so the
    evidence is the published implementation, not a spec path.
- id: a2p-10dlc-tcr
  name: A2P 10DLC / The Campaign Registry
  conforms: true
  evidence: >-
    Declared directly in the contract: openapi/signalwire-rest-openapi.yml carries 12 operations
    under the tags "Campaign Registry: Brands" (3), "Campaign Registry: Campaigns" (4) and
    "Campaign Registry: Phone Number Assignments" (5) at /api/relay/rest/registry/beta/. The
    error-code reference names associated_campaign_inactive and associated_campaign_suspended as
    carrier-returned TCR states.
- id: sip
  name: SIP (RFC 3261)
  conforms: true
  evidence: >-
    Native SIP is a first-class product surface — 5 SIP Address, 7 SIP Credential, 6 SIP Gateway,
    2 SIP Profile and 5 legacy SIP Endpoint operations in the REST contract, plus a FreeSWITCH
    Connector resource. SignalWire is the maintainer of FreeSWITCH.
- id: webrtc
  name: WebRTC
  conforms: true
  evidence: '@signalwire/webrtc is a published first-party package; the Browser SDK and Video
    surface (rooms, room sessions, room tokens, streams) are WebRTC-native.'
- id: e911
  name: E911 / NG911 address registration
  conforms: true
  evidence: 5 operations under the "E911 Addresses" tag in openapi/signalwire-rest-openapi.yml.
- id: twiml-laml
  name: TwiML-compatible markup (cXML / LaML)
  conforms: true
  evidence: >-
    The Compatibility API accepts Twilio-style requests at /api/laml/2010-04-01 with Twilio-shaped
    SIDs and cXML script resources. SignalWire states plainly in its own docs that Twilio and TwiML
    are trademarks of Twilio, Inc. and that SignalWire is not affiliated with or endorsed by Twilio.
